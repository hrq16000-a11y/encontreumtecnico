name: EUT R18 candidate browser QA (read only)
on:
  pull_request:
    paths:
      - 'scripts/eut-r18-assistance-qa.cjs'
      - '.github/workflows/eut-r18-assistance-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  r18-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: bun install --frozen-lockfile
      - name: Test changed funnel and ranking
        run: bunx vitest run src/components/assistance-funnel.test.tsx src/lib/searchable-options.test.ts
      - name: Install isolated Chromium
        run: |
          mkdir -p "$RUNNER_TEMP/eut-r18-browser"
          cd "$RUNNER_TEMP/eut-r18-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Run candidate, not the currently published site
        run: |
          set -euo pipefail
          bun run dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/eut-r18-vite.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true; tail -80 "$RUNNER_TEMP/eut-r18-vite.log"' EXIT
          for i in $(seq 1 90); do
            if curl --silent --fail --max-time 10 http://127.0.0.1:4173/contato > /dev/null; then break; fi
            sleep 2
          done
          EUT_BASE_URL=http://127.0.0.1:4173 NODE_PATH="$RUNNER_TEMP/eut-r18-browser/node_modules" node scripts/eut-r18-assistance-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eut-r18-candidate-viewport
          path: artifacts/eut-r18/
          if-no-files-found: ignore
