name: EUT one-off Home help hydration smoke (390px)
on:
  push:
    branches:
      - integration/free-help-focus-clean-after-268-20261113
    paths:
      - .github/workflows/eut-free-help-hydration-20261113.yml
permissions:
  contents: read
jobs:
  local-chromium-help-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install existing locked app dependencies (no cache)
        run: bun install --frozen-lockfile
      - name: Install disposable Chromium runner (no cache or artifacts)
        run: |
          mkdir -p "$RUNNER_TEMP/eut-focus-playwright"
          cd "$RUNNER_TEMP/eut-focus-playwright"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Run only local Home 390px hydration/focus smoke
        env:
          VITE_SUPABASE_PROJECT_ID: synthetic-local
          VITE_SUPABASE_URL: http://127.0.0.1:9
          VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-local-public
          EUT_BASE_URL: http://127.0.0.1:5173
        run: |
          set -euo pipefail
          bun run dev --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/eut-focus-vite.log" 2>&1 &
          dev_pid=$!
          trap 'kill "$dev_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5173/; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "VITE_LOCAL_NOT_READY"
            tail -n 35 "$RUNNER_TEMP/eut-focus-vite.log"
            exit 1
          fi
          rc=0
          NODE_PATH="$RUNNER_TEMP/eut-focus-playwright/node_modules" node scripts/eut-free-help-hydration-smoke.cjs || rc=$?
          echo "LOCAL_VITE_LOG_TAIL"
          tail -n 35 "$RUNNER_TEMP/eut-focus-vite.log"
          exit "$rc"
