name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        if: hashFiles('bun.lock', 'bun.lockb') != ''
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun install --frozen-lockfile
          elif [[ -f pnpm-lock.yaml ]]; then
            pnpm install --frozen-lockfile
          elif [[ -f package-lock.json ]]; then
            npm ci
          else
            npm install
          fi

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          script=$(node -e "const p=require('./package.json'); process.stdout.write((p.scripts&&p.scripts.test)||'')")
          if [[ -z "$script" ]]; then
            echo "sem script test"
            exit 0
          fi
          if [[ "$script" == *playwright* || "$script" == *e2e* ]]; then
            echo "e2e fica fora deste CI"
            exit 0
          fi
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun run test
          elif [[ -f pnpm-lock.yaml ]]; then
            pnpm test
          else
            npm test
          fi

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f bun.lock || -f bun.lockb ]]; then
            bun run build
          elif [[ -f pnpm-lock.yaml ]]; then
            pnpm run build
          else
            npm run build
          fi
