name: EUT activation and cutover gate

on:
  pull_request:
    paths:
      - 'src/routes/reivindicar-cadastro.tsx'
      - 'src/routes/reivindicar-cadastro.test.tsx'
      - '.github/workflows/eut-activation-cutover.yml'
      - 'src/routes/__root.tsx'
      - 'src/routes/index.tsx'
      - 'src/routes/tecnicos.index.tsx'
      - 'src/routes/tecnicos.$tecnicoId.tsx'
      - 'src/routes/sitemap*.xml.ts'
      - 'src/lib/public-sitemap.ts'
      - 'src/lib/public-sitemap-index.ts'
      - 'src/lib/public-sitemap-index.test.ts'
      - 'public/robots.txt'
      - '.github/workflows/eut-seo-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eut-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  app-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install reproducibly
        run: bun install --frozen-lockfile
      - name: Build server and client
        run: bun run build
      - name: Verify canonical sitemap index and public sitemap parts
        run: bunx vitest run src/lib/public-sitemap-index.test.ts src/lib/public-sitemap.test.ts
      - name: Test legacy claims are scoped to the signed-in account
        run: bunx vitest run src/routes/reivindicar-cadastro.test.tsx
      - name: SEO cutover static safety checks
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read = (name) => readFileSync(name, 'utf8');
          if (read('src/routes/__root.tsx').includes('name: "robots", content: "noindex, nofollow"')) throw Error('Global noindex blocks public search');
          const origin = 'https://www.encontreumtecnico.com.br';
          for (const file of ['src/routes/index.tsx', 'src/routes/tecnicos.index.tsx', 'src/routes/tecnicos.$tecnicoId.tsx', 'src/lib/public-sitemap.ts']) {
            const value = read(file);
            if (!value.includes(origin) || value.includes('find-your-trusted-technician.lovable.app')) throw Error('Wrong canonical or sitemap origin: ' + file);
          }
          if (!read('public/robots.txt').split(/\r?\n/).includes('Sitemap: ' + origin + '/sitemap.xml')) throw Error('Wrong sitemap in robots.txt');
          for (const file of ['src/routes/entrar.tsx','src/routes/redefinir-senha.tsx','src/routes/reivindicar-cadastro.tsx','src/routes/area-cliente.tsx','src/routes/area-tecnico.tsx','src/routes/admin.tsx','src/routes/home2.tsx']) {
            if (!read(file).includes('name: "robots", content: "noindex, nofollow"')) throw Error('Private noindex missing: ' + file);
          }
          console.log('SEO cutover: safe public index + protected routes');
          NODE
      - name: Verify safe legacy self-service contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const code = readFileSync('src/routes/reivindicar-cadastro.tsx', 'utf8');
          for (const part of [
            'eut_my_legacy_candidate_profiles',
            'eligibleToClaim',
            'normalizeWpPostId',
            'status: "pendente"',
            'A equipe verificará sua titularidade antes de vincular os dados antigos.',
          ]) {
            if (!code.includes(part)) throw Error('Missing guarded claim contract: ' + part);
          }
          if (code.includes('service_role') || code.includes('auth.admin.createUser')) throw Error('Unsafe credential management in client');
          console.log('Legacy owner lookup: contract OK');
          NODE

  auth-provider-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check public Supabase Auth settings, without creating accounts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const client = readFileSync('src/integrations/supabase/client.ts', 'utf8');
          const endpoint = client.match(/const SUPABASE_URL = "([^"]+)"/)?.[1];
          const publicKey = client.match(/const SUPABASE_PUBLISHABLE_KEY = "([^"]+)"/)?.[1];
          if (!endpoint || !publicKey) throw Error('Supabase public configuration unavailable');
          const res = await fetch(endpoint + '/auth/v1/settings', {
            headers: { apikey: publicKey },
            signal: AbortSignal.timeout(12000),
          });
          if (!res.ok) throw Error('Supabase Auth settings unreachable (HTTP ' + res.status + ')');
          const settings = await res.json();
          const emailEnabled = settings.external?.email !== false;
          const signupEnabled = settings.disable_signup !== true;
          console.log('Email provider enabled:', emailEnabled);
          console.log('Public signup enabled:', signupEnabled);
          console.log('Google provider enabled:', Boolean(settings.external?.google));
          console.log('Email confirmation required:', settings.mailer_autoconfirm === false);
          if (!emailEnabled || !signupEnabled) throw Error('Required email signup is disabled');
          NODE

  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check currently published Vercel site (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for path in / /entrar /tecnicos /home2 /reivindicar-cadastro; do
            target="https://encontreumtecnico.vercel.app${path}"
            status=$(curl --silent --show-error --location --max-time 18 --output /dev/null --write-out '%{http_code}' "$target")
            echo "${path}: HTTP ${status}"
            test "$status" = "200"
          done
