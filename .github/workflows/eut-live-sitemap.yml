name: EUT live sitemap and content SEO gate
on:
  pull_request:
    paths:
      - 'src/routes/sitemap[.]xml.ts'
      - 'src/lib/public-sitemap.ts'
      - 'src/lib/public-sitemap.test.ts'
      - 'src/routes/servicos.tsx'
      - '.github/workflows/eut-live-sitemap.yml'
permissions:
  contents: read
jobs:
  sitemap:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate sitemap, canonical URLs and SEO regressions
        run: bunx vitest run src/lib/public-sitemap.test.ts src/lib/seo-public-pages.test.ts
      - name: Build SSR and regenerate route tree (no deployment)
        run: bun run build
      - name: TypeScript after TanStack route generation
        run: bunx tsc --noEmit --pretty false
