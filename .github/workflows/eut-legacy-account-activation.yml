name: EUT legacy account activation gate

on:
  pull_request:
    paths:
      - 'src/components/legacy-account-activation.tsx'
      - 'src/components/legacy-account-activation.test.tsx'
      - 'src/routes/area-cliente.tsx'
      - 'src/routes/area-tecnico.tsx'
      - 'src/components/legacy-profile-import.tsx'
      - 'src/routes/reivindicar-cadastro.tsx'
      - 'src/routes/reivindicar-cadastro.test.tsx'
      - 'src/components/legacy-account-isolation.test.tsx'
      - '.github/workflows/eut-legacy-account-activation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eut-legacy-activation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies from lockfile
        run: bun install --frozen-lockfile
      - name: Test WordPress lookup failure and retry
        run: bunx vitest run src/components/legacy-account-activation.test.tsx
      - name: Test account identity isolation of legacy claims
        run: bunx vitest run src/components/legacy-account-isolation.test.tsx src/routes/reivindicar-cadastro.test.tsx
      - name: Build TanStack Start
        run: bun run build
      - name: TypeScript after route generation
        run: bunx tsc --noEmit --pretty false
      - name: TypeScript after build
        run: bunx tsc --noEmit --pretty false
      - name: Validate account-linking guardrails
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('src/components/legacy-account-activation.tsx','utf8');
          const tech = readFileSync('src/routes/area-tecnico.tsx','utf8');
          const client = readFileSync('src/routes/area-cliente.tsx','utf8');
          for (const key of ['eut_my_legacy_account','eut_confirm_my_legacy_account','record.intended_type !== role','reivindicar-cadastro']) {
            if (!source.includes(key)) throw Error('Activation UI missing: '+key);
          }
          if (source.includes('service_role') || source.includes('auth.admin')) throw Error('Privileged client-side auth operation');
          if (!tech.includes('role="tecnico"') || !client.includes('role="cliente"')) throw Error('Activation missing in specific panel');
          console.log('Account activation UI: role separation and identity checks delegated to DB');
          NODE
