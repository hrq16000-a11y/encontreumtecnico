name: EUT one-off Vite hydration and HMR diagnosis
on:
  push:
    branches:
      - integration/free-help-focus-clean-after-268-20261113
    paths:
      - .github/workflows/eut-hydration-hmr-diagnostic-20261113.yml
permissions:
  contents: read
jobs:
  isolated-hydration-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - name: Install existing frozen dependencies
        run: bun install --frozen-lockfile
      - name: Install disposable Chromium (no artifacts or cache)
        run: |
          mkdir -p "$RUNNER_TEMP/eut-browser-diagnostic"
          cd "$RUNNER_TEMP/eut-browser-diagnostic"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Capture local Vite navigation HMR and hydration sequence
        env:
          VITE_SUPABASE_PROJECT_ID: synthetic-local
          VITE_SUPABASE_URL: http://127.0.0.1:9
          VITE_SUPABASE_PUBLISHABLE_KEY: synthetic-local-public
        run: |
          set -euo pipefail
          bun run dev --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/eut-vite-hydration.log" 2>&1 &
          dev_server_pid=$!
          trap 'kill "$dev_server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl --silent --fail --output /dev/null http://127.0.0.1:5173/; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then echo "VITE_NOT_READY"; exit 1; fi
          echo "ROUTE_TREE_GENERATION_DIFF"
          git diff --numstat -- src/routeTree.gen.ts
          set +e
          NODE_PATH="$RUNNER_TEMP/eut-browser-diagnostic/node_modules" node <<'NODE'
          const {chromium}=require('playwright');
          const assert=require('node:assert/strict');
          const BASE='http://127.0.0.1:5173';
          const t0=Date.now();
          const ms=()=>Date.now()-t0;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({viewport:{width:390,height:844},reducedMotion:'reduce',serviceWorkers:'block'});
            let blockedExternal=0;
            const nav=[];
            await ctx.route('**/*',route=>{
              const url=route.request().url();
              if(url.startsWith(BASE+'/')||url.startsWith('data:')||url.startsWith('blob:'))return route.continue();
              blockedExternal++;return route.abort('blockedbyclient');
            });
            await ctx.addInitScript(()=>{
              const stamp=()=>Math.round(performance.now());
              const mark=(kind,detail)=>{
                console.log('EUT_BROWSER_TRACE '+JSON.stringify({kind,detail,t:stamp(),ready:document.readyState}));
              };
              mark('initScript','before app scripts');
              document.addEventListener('readystatechange',()=>mark('readyState',document.readyState));
              document.addEventListener('DOMContentLoaded',()=>mark('DOMContentLoaded',document.readyState));
              window.addEventListener('load',()=>mark('windowLoad',document.readyState));
              window.addEventListener('pageshow',e=>mark('pageshow',e.persisted));
              window.addEventListener('beforeunload',()=>mark('beforeunload','page closing'));
              const NativeWS=window.WebSocket;
              window.WebSocket=new Proxy(NativeWS,{
                construct(target,args){
                  const ws=Reflect.construct(target,args);
                  ws.addEventListener('message',evt=>{
                    try{
                      const data=JSON.parse(evt.data);
                      if(['full-reload','update','prune','error'].includes(data.type))
                        mark('VITE_WS_'+data.type,{path:typeof data.path==='string'?data.path.slice(0,100):null,updates:data.updates?.length??null});
                    }catch{}
                  });
                  return ws;
                }
              });
            });
            await ctx.addInitScript(()=>{
              sessionStorage.setItem('eut-regional-hint-v1',JSON.stringify({city:'Curitiba',uf:'PR',neighborhood:'',source:'ip',savedAt:Date.now()}));
            });
            const page=await ctx.newPage();
            page.on('console',msg=>{const s=msg.text();if(s.startsWith('EUT_BROWSER_TRACE ')||s.includes('[vite]'))console.log('PAGE_CONSOLE '+ms()+' '+s.slice(0,240));});
            page.on('pageerror',err=>console.log('PAGE_ERROR '+ms()+' '+String(err).slice(0,180)));
            page.on('framenavigated',frame=>{if(frame===page.mainFrame()){const e={t:ms(),pathname:new URL(frame.url()).pathname};nav.push(e);console.log('FRAME_NAVIGATED '+JSON.stringify(e));}});
            page.on('domcontentloaded',()=>console.log('PLAYWRIGHT_DOMCONTENTLOADED '+ms()));
            page.on('load',()=>console.log('PLAYWRIGHT_LOAD '+ms()));
            async function snap(label){
              for(let attempt=0;attempt<4;attempt++){
                try{
                  const state=await page.evaluate(()=>{
                    const a=document.activeElement;
                    const cookie=document.querySelector('[role="dialog"][aria-label="Aviso de cookies"]');
                    const help=document.querySelector('#eut-free-help-dialog');
                    return {
                      ready:document.readyState,activeTag:a?.tagName||null,activeAria:a?.getAttribute('aria-label')||null,
                      activeText:(a?.textContent||'').trim().slice(0,42),
                      cookieVisible:!!cookie?.getClientRects().length,
                      helpVisible:!!help?.getClientRects().length,
                      closeFocused:a?.getAttribute('aria-label')==='Fechar atendimento',
                      dialogCount:document.querySelectorAll('[role="dialog"]').length
                    };
                  });
                  console.log('HYDRATION_SNAPSHOT '+JSON.stringify({t:ms(),label,...state}));
                  return state;
                }catch(err){
                  if(!/Execution context was destroyed|navigation|Cannot find context/i.test(String(err)))throw err;
                  console.log('SNAPSHOT_INTERRUPTED_BY_RELOAD '+JSON.stringify({t:ms(),label,attempt}));
                  await page.waitForLoadState('domcontentloaded',{timeout:15000});
                }
              }
              throw Error('SNAPSHOT_UNAVAILABLE_AFTER_NAVIGATION');
            }
            try{
              await page.goto(BASE+'/',{waitUntil:'domcontentloaded',timeout:25000});
              await snap('DOM_CONTENT_LOADED');
              const opener=page.getByRole('button',{name:'Pedir ajuda ao portal',exact:true});
              await opener.waitFor({state:'visible',timeout:12000});
              await opener.scrollIntoViewIfNeeded();
              await opener.focus();
              await snap('BEFORE_FIRST_CLICK');
              await opener.click({timeout:12000});
              const first=await snap('AFTER_FIRST_CLICK');
              await page.waitForTimeout(250);
              const after250=await snap('FIRST_CLICK_PLUS_250MS');
              await page.waitForTimeout(1500);
              const after1750=await snap('FIRST_CLICK_PLUS_1750MS');
              let hydrated=false;
              try{
                await page.locator('[role="dialog"][aria-label="Aviso de cookies"]').waitFor({state:'visible',timeout:6000});
                hydrated=true;
                await snap('COOKIE_USEEFFECT_MOUNTED');
              }catch{console.log('COOKIE_HYDRATION_MARKER_NOT_SEEN '+ms());}
              let second=null;
              if(hydrated){
                await page.getByRole('button',{name:'Rejeitar',exact:true}).click({timeout:5000});
                await snap('COOKIE_REJECTED_SYNTHETIC_CONTEXT');
                await opener.waitFor({state:'visible',timeout:5000});
                await opener.focus();
                await opener.click({timeout:5000});
                await page.waitForTimeout(300);
                second=await snap('CLICK_AFTER_HYDRATION_MARKER');
                if(second.helpVisible){
                  await page.keyboard.press('Escape');
                  await page.waitForTimeout(150);
                  await snap('AFTER_ESCAPE');
                }
              }
              console.log('NAVIGATION_EVENTS '+JSON.stringify(nav));
              console.log('BLOCKED_EXTERNAL_REQUESTS '+blockedExternal);
              console.log('CLASSIFICATION '+JSON.stringify({firstOpen:first.helpVisible||after250.helpVisible||after1750.helpVisible,firstFocused:first.closeFocused||after250.closeFocused||after1750.closeFocused,hydrationMarkerSeen:hydrated,postHydrationOpen:second?.helpVisible??null,postHydrationFocused:second?.closeFocused??null}));
              assert(first.helpVisible||after250.helpVisible||after1750.helpVisible,'FIRST_CLICK_DID_NOT_OPEN_SPECIFIC_ASSISTANCE_MODAL');
              assert(first.closeFocused||after250.closeFocused||after1750.closeFocused,'FIRST_CLICK_DID_NOT_FOCUS_CLOSE_BUTTON');
              console.log('DIAGNOSTIC_FIRST_CLICK_PASS');
            }finally{await ctx.close();await browser.close();}
          })().catch(err=>{console.error('DIAGNOSTIC_FIRST_CLICK_FAIL',err.stack||err);process.exitCode=1});
          NODE
          rc=$?
          echo "VITE_DIAGNOSTIC_LOG_FILTER"
          rg 'reload|optim|changed|route|error|warning' "$RUNNER_TEMP/eut-vite-hydration.log" | tail -n 35 || true
          exit "$rc"
