name: EUT admin validation (without Vercel)
on:
  push:
    branches:
      - feat/eut-admin-catalogo-localizacao-r1
  pull_request:
    branches:
      - lovable-sync
      - main
    paths:
      - "src/components/eut-admin-manager.tsx"
      - "src/lib/service-taxonomy.ts"
      - "src/lib/service-taxonomy.test.ts"
      - "src/routes/admin.tsx"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Unit tests
        run: bun run test
      - name: Build TanStack application
        run: bun run build
