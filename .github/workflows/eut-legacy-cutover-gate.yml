name: EUT legacy URL cutover gate

on:
  pull_request:
    paths:
      - 'src/routes/tecnico.$slug.tsx'
      - 'src/routes/cliente.$slug.tsx'
      - 'src/lib/legacy-avatar-urls.ts'
      - 'src/lib/legacy-cutover.test.ts'
      - 'ops/cutover/**'
      - '.github/workflows/eut-legacy-cutover-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eut-legacy-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Historic URL and privacy regression tests
        run: bunx vitest run src/lib/legacy-cutover.test.ts src/lib/legacy-navigation.test.ts
      - name: Build TanStack Start
        run: bun run build
      - name: TypeScript (after route tree generation)
        run: bunx tsc --noEmit --pretty false
