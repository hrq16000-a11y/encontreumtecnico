name: EUT legacy specialty evidence gate
on:
  pull_request:
    paths:
      - 'src/components/eut-admin-manager.tsx'
      - '.github/workflows/eut-specialty-evidence.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Evidence is review-only
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const c=readFileSync('src/components/eut-admin-manager.tsx','utf8');
          for(const needle of ['eut_legacy_specialty_evidence','.select("taxonomy,term_name,review_state")','não comprovam serviços executados','confirmation_status:"pendente"']) {
            if (!c.includes(needle)) throw Error('Review-only evidence guard missing: '+needle);
          }
          if(c.includes('.from("eut_legacy_specialty_evidence").insert(')||c.includes('.from("eut_legacy_specialty_evidence").update(')) throw Error('Direct evidence mutation in UI');
          console.log('WordPress specialty evidence: admin review only');
          NODE
