name: EUT offline WordPress backup integrity gate
on:
  pull_request:
    paths:
      - 'ops/cutover/verify_backup_integrity.py'
      - 'ops/cutover/tests/**'
      - 'ops/cutover/MEDIA_RESTORE_GATE.md'
      - '.github/workflows/eut-backup-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Offline ZIP/WXR integrity tests (synthetic only)
        run: python3 -m unittest discover -s ops/cutover/tests -p 'test_*.py' -v
