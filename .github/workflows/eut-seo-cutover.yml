name: EUT SEO cutover gate
on:
  pull_request:
    paths:
      - 'src/routes/__root.tsx'
      - 'src/routes/index.tsx'
      - 'src/routes/tecnicos.index.tsx'
      - 'src/routes/tecnicos.$tecnicoId.tsx'
      - 'src/routes/sitemap*.xml.ts'
      - 'src/lib/public-sitemap.ts'
      - 'src/lib/public-sitemap.test.ts'
      - 'src/lib/public-seo-graph.ts'
      - 'src/lib/public-seo-graph.functions.ts'
      - 'src/lib/public-seo-graph.test.ts'
      - 'src/routes/cidades.$uf.$cidade.tsx'
      - 'src/routes/categorias.$categoria.tsx'
      - 'src/components/public-seo-discovery.tsx'
      - 'src/components/text-page.tsx'
      - 'src/routes/lp2/index.tsx'
      - 'src/routes/lp2/galeria.tsx'
      - 'src/routes/home2.tsx'
      - 'src/routes/faq.tsx'
      - 'src/routes/contato.tsx'
      - 'src/routes/servicos.tsx'
      - 'src/routes/como-funciona.tsx'
      - 'src/lib/seo-public-pages.test.ts'
      - 'src/lib/social-preview.test.ts'
      - 'public/social-preview.jpg'
      - 'src/lib/technician-id.ts'
      - 'src/lib/technician-id.test.ts'
      - 'docs/sql/eut-technician-public-slugs-20261110.sql'
      - 'src/lib/technicians.functions.ts'
      - 'src/lib/technicians.functions.test.ts'
      - 'src/lib/technician-slug-migration.test.ts'
      - 'scripts/eut-public-smoke.mjs'
      - 'public/robots.txt'
      - '.github/workflows/eut-seo-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-cutover-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile
      - name: SEO regression tests
        run: bunx vitest run src/lib/seo-public-pages.test.ts src/lib/public-sitemap.test.ts src/lib/public-seo-graph.test.ts src/lib/social-preview.test.ts src/lib/technician-id.test.ts src/lib/technicians.functions.test.ts src/lib/technician-slug-migration.test.ts
      - name: Build TanStack
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit --pretty false
