name: EUT PR344 — signed transitions S3 isolated only

on:
  pull_request:
    paths:
      - '.github/workflows/eut-pr344-signed-transitions-s3-isolated.yml'
      - 'qa/pr344-signed-transitions-disposable.sql'
      - 'qa/pr344-signed-transitions-only.mjs'
      - 'qa/pr344-signed-transitions-s3.test.mjs'

permissions:
  contents: read

concurrency:
  group: eut-pr344-signed-transitions-${ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  signed-transitions-s3:
    if: github.event.pull_request.number == 344
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PR344_LOCAL_ONLY: 'yes'
      PR344_ISSUE_TEST_ONLY: 'enabled'
      SUPABASE_ACCESS_TOKEN: ''
      VITE_EUT_HTTP_PRESENCE_INGEST: 'disabled'
      VITE_EUT_HTTP_PRESENCE_ADMIN_READ: 'disabled'
      VITE_EUT_PRIVATE_REALTIME_PRESENCE: 'disabled'
      PGHOST: '127.0.0.1'
      PGPORT: '54322'
      PGUSER: 'postgres'
      PGPASSWORD: 'postgres'
      PGDATABASE: 'postgres'
      SUPABASE_YES: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          version: '3.2.0'

      - name: Scope gate — local only; S3 syntax; no official connection
        shell: bash
        run: |
          set -euo pipefail
          test "$PR344_LOCAL_ONLY" = yes
          test "$PR344_ISSUE_TEST_ONLY" = enabled
          test -z "$SUPABASE_ACCESS_TOKEN"
          test "$VITE_EUT_HTTP_PRESENCE_INGEST" = disabled
          test "$VITE_EUT_HTTP_PRESENCE_ADMIN_READ" = disabled
          test "$VITE_EUT_PRIVATE_REALTIME_PRESENCE" = disabled
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 54322
          node --check qa/pr344-signed-transitions-only.mjs
          node --check qa/pr344-signed-transitions-s3.test.mjs
          if grep -En 'encontreumtecnico\.com\.br|SUPABASE_DB_PASSWORD|https://[^ ]*supabase\.co' \
             qa/pr344-signed-transitions-only.mjs \
             qa/pr344-signed-transitions-s3.test.mjs \
             qa/pr344-signed-transitions-disposable.sql; then
            echo "Hosted Supabase or production data is forbidden in S3 tests" >&2
            exit 1
          fi
          if grep -R -n "pr344-signed-transitions-only" src; then
            echo "QA-only handler must never be imported by production src" >&2
            exit 1
          fi
          echo "S3 isolated scope verified"

      - name: Install existing pinned dependencies
        run: bun install --frozen-lockfile

      - name: Create a fresh unlinked Supabase localhost
        shell: bash
        run: |
          set -euo pipefail
          stack="$(mktemp -d "$RUNNER_TEMP/pr344-s3-XXXXXX")"
          echo "PR344_S3_STACK=$stack" >> "$GITHUB_ENV"
          cd "$stack"
          supabase init
          test -f supabase/config.toml
          supabase start > "$RUNNER_TEMP/pr344-s3-start.log" 2>&1
          echo "S3: disposable Supabase started, no project linked"

      - name: Apply S3-only synthetic SQL on loopback and audit grants
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGPORT" = 54322
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql -X -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/qa/pr344-signed-transitions-disposable.sql" >/dev/null
          allowed="$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT CASE WHEN c.relrowsecurity AND NOT has_table_privilege('anon','public.pr344_signed_s3_leases','SELECT') AND NOT has_table_privilege('authenticated','public.pr344_signed_s3_leases','SELECT') AND NOT has_function_privilege('anon','public.pr344_signed_s3_apply(text,text,timestamptz,timestamptz,timestamptz)','EXECUTE') AND NOT has_function_privilege('authenticated','public.pr344_signed_s3_apply(text,text,timestamptz,timestamptz,timestamptz)','EXECUTE') AND has_function_privilege('service_role','public.pr344_signed_s3_apply(text,text,timestamptz,timestamptz,timestamptz)','EXECUTE') THEN 'ok' ELSE 'bad' END FROM pg_class c WHERE c.oid='public.pr344_signed_s3_leases'::regclass")"
          test "$allowed" = ok
          sleep 3
          echo "S3: private synthetic tables and privileged RPC verified"

      - name: Export only disposable Supabase test credentials
        shell: bash
        run: |
          set -euo pipefail
          cd "$PR344_S3_STACK"
          set -a
          source <(supabase status -o env)
          set +a
          [[ "${API_URL:-}" =~ ^http://127\.0\.0\.1:[0-9]+$ ]] || exit 1
          test -n "${ANON_KEY:-}"
          test -n "${SERVICE_ROLE_KEY:-}"
          test "$ANON_KEY" != "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "PR344_API_URL=$API_URL"
            echo "PR344_ANON_KEY=$ANON_KEY"
            echo "PR344_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
          echo "S3: ephemeral credentials available to this runner only"

      - name: S3 only — signed revocation, concurrent beat/leave, expired replay
        run: timeout --signal=TERM --kill-after=5s 100s node --test qa/pr344-signed-transitions-s3.test.mjs

      - name: Stop and discard local Supabase on every outcome
        if: always()
        shell: bash
        run: |
          if [ -n "${PR344_S3_STACK:-}" ] && [ -f "$PR344_S3_STACK/supabase/config.toml" ]; then
            cd "$PR344_S3_STACK"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          echo "S3: disposable database stopped and not backed up"
