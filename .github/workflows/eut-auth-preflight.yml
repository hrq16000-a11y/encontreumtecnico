name: EUT Auth and WordPress recovery preflight

on:
  pull_request:
    paths:
      - 'src/routes/entrar.tsx'
      - 'src/lib/onboarding-legacy-fallback.ts'
      - 'src/lib/onboarding-legacy-fallback.test.ts'
      - 'src/hooks/use-auth.tsx'
      - 'src/hooks/use-auth.test.tsx'
      - 'src/lib/auth-domain.ts'
      - 'src/lib/auth-domain.test.ts'
      - 'src/lib/google-identity-hint.ts'
      - 'src/lib/google-identity-hint.test.ts'
      - 'src/lib/signup-intent.ts'
      - 'src/components/connected-google-identity.tsx'
      - 'src/routes/cadastro.tsx'
      - 'docs/sql/eut-project-owner-bootstrap.sql'
      - '.github/workflows/eut-auth-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eut-auth-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test live-auth hook against account switching, signout and stale roles
        run: bun run test src/hooks/use-auth.test.tsx src/lib/account-scoped-queries.test.ts src/lib/auth-domain.test.ts src/lib/google-identity-hint.test.ts
      - name: Build app and generate TanStack route tree
        run: bun run build
      - name: TypeScript after TanStack route generation
        run: bunx tsc --noEmit --pretty false
      - name: Verify server-authorized roles and optional legacy discovery
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const ui=readFileSync('src/routes/entrar.tsx','utf8');
          const auth=readFileSync('src/hooks/use-auth.tsx','utf8');
          for (const term of [
            'eut_my_legacy_account', 'eut_confirm_my_legacy_account',
            'legacyLookupError', 'setLegacyChecked(false)',
            'Tentar consultar novamente',
            'disabled={busy || !canAttemptRole || !termsAccepted || rolesError || ownerCheckPending || ownerCheckError}',
            'canAttemptNewAccountRole({ legacyChecked, legacyLookupError, legacyRole })',
            'supabase.rpc("choose_account_type", { _role: role })',
            'Técnico com regras atuais',
            'Cliente com regras atuais',
          ]) {
            if (!ui.includes(term)) throw Error('Missing safe first-login step: '+term);
          }
          if (!auth.includes('provider: "google"')) throw Error('No Google login configured');
          for (const guard of ['accountIdRef.current = nextId', 'setRoles([])', 'roleLookupVersion.current', 'canAcceptAccountResult']) {
            if (!auth.includes(guard)) throw Error('Missing role isolation guard: '+guard);
          }
          if (ui.includes('service_role')||ui.includes('auth.admin.createUser'))
            throw Error('Privileged account creation in browser');
          const newRoleGuard=readFileSync('src/lib/onboarding-legacy-fallback.ts','utf8');
          if (!newRoleGuard.includes('state.legacyRole === null') ||
              !newRoleGuard.includes('state.legacyLookupError'))
            throw Error('Do not use a stale imported role after failed legacy lookup');
          console.log('Verified Google/session and server-only role authority; optional legacy lookup failures do not block new registration');
          NODE
      - name: Verify one-time project-owner bootstrap contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const sql = readFileSync('docs/sql/eut-project-owner-bootstrap.sql','utf8');
          const signin = readFileSync('src/routes/entrar.tsx','utf8');
          for (const term of [
            'eut_migration.project_owner_bootstrap',
            'eut_can_bootstrap_project_owner',
            'eut_bootstrap_project_owner',
            "i.provider='google'",
            "i.identity_data->>'email_verified'='true'",
            'email_confirmed_at IS NOT NULL',
            'pg_advisory_xact_lock',
            'FOR UPDATE',
            "REVOKE ALL ON FUNCTION public.eut_bootstrap_project_owner() FROM PUBLIC, anon, authenticated",
            'GRANT EXECUTE ON FUNCTION public.eut_bootstrap_project_owner() TO authenticated',
          ]) if (!sql.includes(term)) throw Error('Owner bootstrap safeguard missing: '+term);
          for (const term of [
            'canBootstrapOwner', 'ownerCheckPending', 'ownerCheckError',
            'eut_can_bootstrap_project_owner', 'eut_bootstrap_project_owner',
            'Ativar administração do novo portal', 'termsAccepted',
          ]) if (!signin.includes(term)) throw Error('Owner UI safeguard missing: '+term);
          if (/\b(?:[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,})\b/i.test(sql)) {
            throw Error('Personal bootstrap email must not be committed to public repository');
          }
          console.log('One-time owner bootstrap static contract: OK');
          NODE
      - name: Check live Supabase Auth provider (no account creation)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const client=readFileSync('src/integrations/supabase/client.ts','utf8');
          const base=client.match(/const SUPABASE_URL = "([^"]+)"/)?.[1];
          const apikey=client.match(/const SUPABASE_PUBLISHABLE_KEY = "([^"]+)"/)?.[1];
          if (!base||!apikey||!base.endsWith('.supabase.co'))throw Error('Supabase public project config missing');
          const settingsResponse=await fetch(base+'/auth/v1/settings',{
            headers:{apikey},
            signal:AbortSignal.timeout(12000)
          });
          if (!settingsResponse.ok)throw Error('Auth settings returned HTTP '+settingsResponse.status);
          const settings=await settingsResponse.json();
          if (settings.disable_signup === true || settings.external?.email===false)throw Error('Email signup disabled');
          if (settings.external?.google !== true)throw Error('Google provider disabled; cannot validate login cutover');
          console.log('Auth settings reachable; signups and Google provider enabled');
          for (const host of [
            'https://encontreumtecnico.vercel.app',
            'https://www.encontreumtecnico.com'
          ]) {
            const url=base+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(host+'/entrar');
            const r=await fetch(url,{
              headers:{apikey},
              redirect:'manual',
              signal:AbortSignal.timeout(12000)
            });
            const location=r.headers.get('location');
            if (r.status<300||r.status>=400||!location) {
              throw Error('Google OAuth authorization start failed (HTTP '+r.status+') for '+new URL(host).host);
            }
            const target=new URL(location,base);
            if (target.protocol!=='https:' || !(target.hostname==='accounts.google.com'||target.hostname.endsWith('.google.com'))) {
              throw Error('OAuth did not redirect to the Google identity provider');
            }
            // Do not print tokens, authorization state, Location header or user information.
            console.log('Google OAuth start accepted for '+new URL(host).host+': redirect to Google');
          }
          console.log('NOTE: callback, final verified login and SMTP still require an owner session; these were not simulated');
          NODE
      - name: Check preview access screens without authenticating
        run: |
          node --input-type=module <<'NODE'
          for (const path of ['/entrar','/redefinir-senha','/area-tecnico','/area-cliente','/reivindicar-cadastro']) {
            const res=await fetch('https://encontreumtecnico.vercel.app'+path,{
              redirect:'follow',
              signal:AbortSignal.timeout(15000)
            });
            if (!res.ok)throw Error('Preview route '+path+' unavailable: HTTP '+res.status);
            console.log(path+': HTTP '+res.status);
          }
          NODE
      - name: Validate live public catalog and private API boundary without signing in
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const client=readFileSync('src/integrations/supabase/client.ts','utf8');
          const base=client.match(/const SUPABASE_URL = "([^"]+)"/)?.[1];
          const key=client.match(/const SUPABASE_PUBLISHABLE_KEY = "([^"]+)"/)?.[1];
          if(!base||!key)throw Error('Missing public Supabase app config');
          const headers={apikey:key,accept:'application/json'};
          const endpoint=(path)=>base+'/rest/v1/'+path;
          for(const table of ['eut_service_categories','eut_service_types']) {
            const r=await fetch(endpoint(table+'?select=slug&active=eq.true&limit=1'),{
              headers, signal:AbortSignal.timeout(12000)
            });
            if(!r.ok)throw Error('Anonymous public catalog failed: '+table+' HTTP '+r.status);
            const rows=await r.json();
            if(!Array.isArray(rows)||rows.length===0||typeof rows[0]?.slug!=='string'){
              throw Error('Anonymous catalog empty or invalid: '+table);
            }
            console.log('Anonymous catalog:',table,'available');
          }
          const technicians=await fetch(endpoint('technicians?select=id&status=eq.aprovado&limit=1'),{
            headers, signal:AbortSignal.timeout(12000)
          });
          if(!technicians.ok||!Array.isArray(await technicians.json())){
            throw Error('Anonymous technician search cannot retrieve approved directory');
          }
          console.log('Approved technician search API reachable (may be empty before first verified signup)');
          for(const [table,columns] of [
            ['eut_direct_request_replies','request_id,body'],
            ['eut_direct_request_consents','request_id'],
            ['eut_technician_private_contacts','phone_e164'],
          ]) {
            const r=await fetch(endpoint(table+'?select='+encodeURIComponent(columns)+'&limit=1'),{
              headers,signal:AbortSignal.timeout(12000)
            });
            if(r.ok)throw Error('Private table accessible anonymously: '+table);
            if(r.status>=500)throw Error('Unexpected server error while checking private table '+table);
            console.log('Anonymous private-table access denied:',table,'HTTP',r.status);
          }
          for(const [name,payload] of [
            ['eut_share_direct_request',{_request_id:'00000000-0000-0000-0000-000000000000'}],
            ['eut_respond_to_direct_request',{_request_id:'00000000-0000-0000-0000-000000000000',_body:'Verificando bloqueio de acesso anônimo sem criar pedido ou resposta.'}],
          ]) {
            const r=await fetch(endpoint('rpc/'+name),{
              method:'POST',headers:{...headers,'content-type':'application/json'},
              body:JSON.stringify(payload),signal:AbortSignal.timeout(12000)
            });
            if(r.ok)throw Error('Sensitive RPC callable anonymously: '+name);
            if(r.status>=500)throw Error('Unexpected server error checking private RPC '+name);
            console.log('Anonymous RPC call denied:',name,'HTTP',r.status);
          }
          // These are not E2E claims: no user, account, purchase or service request is created.
          console.log('Read-only production API preflight PASS; real Google callback and signed-in RLS require two opted-in human accounts');
          NODE

  appendonce-local-synthetic:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eut261_local
          POSTGRES_USER: eut261_local_admin
          POSTGRES_PASSWORD: synthetic-only-pg17
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eut261_local_admin -d eut261_local"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Homologar appendOnce em PostgreSQL 17 local sintético
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          
          # Disposable postgres:17-alpine service only; no external database endpoints.
          export PGHOST=127.0.0.1 PGPORT=5432 PGDATABASE=eut261_local
          export PGUSER=eut261_local_admin PGPASSWORD=synthetic-only-pg17
          command -v psql >/dev/null || { echo 'BLOCKED: PostgreSQL client missing'; exit 1; }
          version="$(psql -X -Atqc 'SHOW server_version_num')"
          test "${version:0:2}" = '17' || { echo "BLOCKED: unexpected PostgreSQL version $version"; exit 1; }
          echo 'PG17_LOCAL_DISPOSABLE: version verified'
          
          psql -X -v ON_ERROR_STOP=1 <<'LOCAL_ROLES'
          CREATE ROLE anon NOLOGIN NOBYPASSRLS;
          CREATE ROLE authenticated NOLOGIN NOBYPASSRLS;
          CREATE ROLE eut_legal_local_writer NOLOGIN NOBYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
          AS $auth$ SELECT nullif(current_setting('request.jwt.claim.sub', true),'')::uuid $auth$;
          REVOKE ALL ON SCHEMA auth FROM PUBLIC;
          GRANT USAGE ON SCHEMA auth TO authenticated, eut_legal_local_writer;
          LOCAL_ROLES
          
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/eut-assistant-legal-ledger-local-proposal-20261113.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/eut-assistant-legal-appendonce-local-contract-20261113.sql
          psql -X -v ON_ERROR_STOP=1 <<'LOCAL_GRANTS'
          GRANT USAGE ON SCHEMA eut_assistant_legal TO eut_legal_local_writer;
          GRANT SELECT, INSERT ON eut_assistant_legal.acceptance_events TO eut_legal_local_writer;
          GRANT USAGE ON SEQUENCE eut_assistant_legal.acceptance_events_event_seq_seq TO eut_legal_local_writer;
          GRANT EXECUTE ON FUNCTION eut_assistant_legal.append_once_local(uuid, uuid, text, text, text) TO eut_legal_local_writer;
          CREATE POLICY eut_legal_local_writer_read ON eut_assistant_legal.acceptance_events
            FOR SELECT TO eut_legal_local_writer USING (auth.uid() = user_id);
          CREATE POLICY eut_legal_local_writer_insert ON eut_assistant_legal.acceptance_events
            FOR INSERT TO eut_legal_local_writer WITH CHECK (auth.uid() = user_id);
          LOCAL_GRANTS
          echo 'PG17_LOCAL_PERMISSIONS: NOLOGIN roles, FORCE RLS, server-writer grants only'
          
          psql -X -v ON_ERROR_STOP=1 <<'LOCAL_LEDGER'
          BEGIN;
          SET LOCAL ROLE eut_legal_local_writer;
          SET LOCAL "request.jwt.claim.sub" = '11111111-1111-4111-8111-111111111111';
          DO $tests$
          DECLARE
            a record;
            replay record;
            conflict record;
            revoked record;
            a2 record;
            missing record;
            n integer;
          BEGIN
            SELECT * INTO missing FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000001','revoke',null,null);
            IF missing.status <> 'no_active_acceptance' THEN RAISE EXCEPTION 'orphan revoke allowed'; END IF;
          
            SELECT * INTO a FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000002','accept','terms-1','privacy-1');
            IF a.status <> 'appended' OR a.event_id IS NULL OR a.event_seq IS NULL
               OR a.user_id <> '11111111-1111-4111-8111-111111111111'
               OR a.recorded_at IS NULL OR a.terms_version <> 'terms-1' THEN
              RAISE EXCEPTION 'accept/audit failed';
            END IF;
            SELECT * INTO replay FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000002','accept','terms-1','privacy-1');
            IF replay.status <> 'replayed' OR replay.event_id <> a.event_id
              OR replay.event_seq <> a.event_seq OR replay.recorded_at <> a.recorded_at THEN
              RAISE EXCEPTION 'idempotent replay changed audit';
            END IF;
            SELECT * INTO conflict FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000002','accept','terms-2','privacy-1');
            IF conflict.status <> 'idempotency_conflict' OR conflict.event_id IS NOT NULL THEN
              RAISE EXCEPTION 'conflicting key accepted or audit leaked';
            END IF;
            SELECT * INTO revoked FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000003','revoke',null,null);
            IF revoked.status <> 'appended' OR revoked.event_kind <> 'revoke'
               OR revoked.terms_version IS NOT NULL THEN RAISE EXCEPTION 'revoke failed'; END IF;
            SELECT * INTO replay FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000003','revoke',null,null);
            IF replay.status <> 'replayed' OR replay.event_id <> revoked.event_id THEN
              RAISE EXCEPTION 'revoke replay failed';
            END IF;
            SELECT * INTO missing FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000004','revoke',null,null);
            IF missing.status <> 'no_active_acceptance' THEN RAISE EXCEPTION 'double revoke accepted'; END IF;
            SELECT * INTO a2 FROM eut_assistant_legal.append_once_local(
              '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000005','accept','terms-2','privacy-2');
            IF a2.status <> 'appended' OR a2.event_seq::bigint <= revoked.event_seq::bigint
               OR date_trunc('milliseconds',a2.recorded_at::timestamptz)
                  <= date_trunc('milliseconds',revoked.recorded_at::timestamptz) THEN
               RAISE EXCEPTION 'reaccept audit/ordering failed';
            END IF;
            SELECT count(*) INTO n FROM eut_assistant_legal.acceptance_events;
            IF n <> 3 THEN RAISE EXCEPTION 'unexpected replay/conflit row count %',n; END IF;
            RAISE NOTICE 'PASS: accept, revoke, no-active, replay, conflict, audit fields, UTC and temporal order';
          END
          $tests$;
          COMMIT;
          
          BEGIN;
          SET LOCAL ROLE eut_legal_local_writer;
          SET LOCAL "request.jwt.claim.sub" = '22222222-2222-4222-8222-222222222222';
          DO $isolation$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM eut_assistant_legal.acceptance_events;
            IF n <> 0 THEN RAISE EXCEPTION 'cross-user SELECT leaked % records',n; END IF;
            BEGIN
              PERFORM * FROM eut_assistant_legal.append_once_local(
                '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000006','accept','terms-1','privacy-1');
              RAISE EXCEPTION 'spoofed user accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
            BEGIN
              INSERT INTO eut_assistant_legal.acceptance_events (user_id,idempotency_key,event_kind,terms_version,privacy_notice_version)
              VALUES ('11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000007','accept','terms-1','privacy-1');
              RAISE EXCEPTION 'cross-user INSERT accepted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
            BEGIN
              UPDATE eut_assistant_legal.acceptance_events SET event_kind='revoke';
              RAISE EXCEPTION 'UPDATE permitted on immutable history';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
            BEGIN
              DELETE FROM eut_assistant_legal.acceptance_events;
              RAISE EXCEPTION 'DELETE permitted on immutable history';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
            RAISE NOTICE 'PASS: user isolation, subject spoof rejection, append-only permissions';
          END
          $isolation$;
          ROLLBACK;
          
          BEGIN;
          SET LOCAL ROLE authenticated;
          SET LOCAL "request.jwt.claim.sub" = '11111111-1111-4111-8111-111111111111';
          DO $client$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM eut_assistant_legal.acceptance_events;
            IF n <> 3 THEN RAISE EXCEPTION 'authenticated own-user SELECT wrong count %',n; END IF;
            BEGIN
              PERFORM * FROM eut_assistant_legal.append_once_local(
                '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000008','accept','terms-1','privacy-1');
              RAISE EXCEPTION 'authenticated client EXECUTE permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
            RAISE NOTICE 'PASS: authenticated can only SELECT own events; direct writer call denied';
          END
          $client$;
          ROLLBACK;
          
          BEGIN;
          SET LOCAL ROLE anon;
          DO $anon$
          BEGIN
            BEGIN
              PERFORM * FROM eut_assistant_legal.append_once_local(
                '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000009','accept','terms-1','privacy-1');
              RAISE EXCEPTION 'anonymous client EXECUTE permitted';
            EXCEPTION WHEN insufficient_privilege THEN NULL;
            END;
            RAISE NOTICE 'PASS: anonymous writer call denied';
          END
          $anon$;
          ROLLBACK;
          
          BEGIN;
          SET LOCAL ROLE eut_legal_local_writer;
          SET LOCAL "request.jwt.claim.sub" = '22222222-2222-4222-8222-222222222222';
          DO $rollback$
          DECLARE v record;
          BEGIN
            SELECT * INTO v FROM eut_assistant_legal.append_once_local(
              '22222222-2222-4222-8222-222222222222','00000000-0000-4000-8000-000000000010','accept','terms-1','privacy-1');
            IF v.status <> 'appended' THEN RAISE EXCEPTION 'rollback setup append failed'; END IF;
          END
          $rollback$;
          ROLLBACK;
          DO $check$
          BEGIN
            IF EXISTS (SELECT 1 FROM eut_assistant_legal.acceptance_events
                WHERE user_id='22222222-2222-4222-8222-222222222222') THEN
              RAISE EXCEPTION 'ROLLBACK persisted a synthetic row';
            END IF;
            RAISE NOTICE 'PASS: transaction rollback left no record';
          END
          $check$;
          
          BEGIN;
          UPDATE eut_assistant_legal.acceptance_events
          SET recorded_at=clock_timestamp()+interval '120 seconds'
          WHERE event_seq=(SELECT max(event_seq) FROM eut_assistant_legal.acceptance_events
                           WHERE user_id='11111111-1111-4111-8111-111111111111');
          SET LOCAL ROLE eut_legal_local_writer;
          SET LOCAL "request.jwt.claim.sub" = '11111111-1111-4111-8111-111111111111';
          DO $clock$
          BEGIN
            BEGIN
              PERFORM * FROM eut_assistant_legal.append_once_local(
                '11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000011','accept','terms-3','privacy-3');
              RAISE EXCEPTION 'future/inconsistent audit accepted';
            EXCEPTION WHEN data_exception THEN
              IF SQLSTATE <> '22000' THEN RAISE; END IF;
            END;
            RAISE NOTICE 'PASS: inconsistent future audit rejected';
          END
          $clock$;
          ROLLBACK;
          LOCAL_LEDGER
          
          # Two actual PostgreSQL client sessions, concurrent same subject and same key.
          (
            psql -X -At -v ON_ERROR_STOP=1 <<'CONCURRENT_ONE'
          BEGIN;
          SET LOCAL ROLE eut_legal_local_writer;
          SET LOCAL "request.jwt.claim.sub" = '22222222-2222-4222-8222-222222222222';
          SELECT status FROM eut_assistant_legal.append_once_local('22222222-2222-4222-8222-222222222222','00000000-0000-4000-8000-000000000012','accept','terms-1','privacy-1');
          SELECT pg_sleep(0.4);
          COMMIT;
          CONCURRENT_ONE
          ) >"${RUNNER_TEMP}/eut261-concurrency-1.txt" 2>&1 &
          pid1=$!
          (
            psql -X -At -v ON_ERROR_STOP=1 <<'CONCURRENT_TWO'
          BEGIN;
          SET LOCAL ROLE eut_legal_local_writer;
          SET LOCAL "request.jwt.claim.sub" = '22222222-2222-4222-8222-222222222222';
          SELECT status FROM eut_assistant_legal.append_once_local('22222222-2222-4222-8222-222222222222','00000000-0000-4000-8000-000000000012','accept','terms-1','privacy-1');
          COMMIT;
          CONCURRENT_TWO
          ) >"${RUNNER_TEMP}/eut261-concurrency-2.txt" 2>&1 &
          pid2=$!
          wait "$pid1"
          wait "$pid2"
          cat "${RUNNER_TEMP}/eut261-concurrency-1.txt" "${RUNNER_TEMP}/eut261-concurrency-2.txt" | grep -xE 'appended|replayed' | sort >"${RUNNER_TEMP}/eut261-statuses.txt"
          test "$(sed -n '1p' "${RUNNER_TEMP}/eut261-statuses.txt")" = appended
          test "$(sed -n '2p' "${RUNNER_TEMP}/eut261-statuses.txt")" = replayed
          test "$(wc -l <"${RUNNER_TEMP}/eut261-statuses.txt")" -eq 2
          echo 'PASS: two concurrent PG17 sessions, one append and one idempotent replay'
          
          # Different keys against same user must still serialize and order timestamps.
          for k in 013 014; do
            (
              psql -X -At -v ON_ERROR_STOP=1 -c "BEGIN; SET LOCAL ROLE eut_legal_local_writer; SET LOCAL \"request.jwt.claim.sub\" = '11111111-1111-4111-8111-111111111111'; SELECT status FROM eut_assistant_legal.append_once_local('11111111-1111-4111-8111-111111111111','00000000-0000-4000-8000-000000000${k}','accept','terms-2','privacy-2'); COMMIT;" \
                >"${RUNNER_TEMP}/eut261-key-${k}.txt" 2>&1
            ) &
          done
          wait
          grep -qx appended "${RUNNER_TEMP}/eut261-key-013.txt"
          grep -qx appended "${RUNNER_TEMP}/eut261-key-014.txt"
          
          psql -X -v ON_ERROR_STOP=1 <<'LOCAL_FINAL'
          DO $final$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM eut_assistant_legal.acceptance_events
            WHERE user_id='22222222-2222-4222-8222-222222222222';
            IF n <> 1 THEN RAISE EXCEPTION 'concurrent key duplicated: % rows',n; END IF;
            SELECT count(*) INTO n FROM eut_assistant_legal.acceptance_events
            WHERE user_id='11111111-1111-4111-8111-111111111111';
            IF n <> 5 THEN RAISE EXCEPTION 'different-key count wrong: % rows',n; END IF;
            SELECT count(*) INTO n FROM (
              SELECT date_trunc('milliseconds',recorded_at) AS ms,
                     lag(date_trunc('milliseconds',recorded_at)) OVER (PARTITION BY user_id ORDER BY event_seq) AS prev_ms
              FROM eut_assistant_legal.acceptance_events
            ) ordered WHERE prev_ms IS NOT NULL AND ms <= prev_ms;
            IF n <> 0 THEN RAISE EXCEPTION 'out-of-order audit timestamp: % rows',n; END IF;
            SELECT count(*) INTO n FROM eut_assistant_legal.acceptance_events
            WHERE event_id IS NULL OR idempotency_key IS NULL OR terms_version IS NULL AND event_kind='accept';
            IF n <> 0 THEN RAISE EXCEPTION 'malformed audit records: % rows',n; END IF;
            RAISE NOTICE 'PASS: concurrent distinct keys, strict millisecond ordering, complete audit, no duplicates';
          END
          $final$;
          LOCAL_FINAL
          
          echo 'EUT261_PG17_LOCAL_SYNTHETIC_PASS: accept revoke idempotency conflict isolation concurrency audit rollback'
