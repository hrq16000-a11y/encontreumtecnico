name: EUT operations profile real Auth isolated QA
on:
  pull_request:
    paths:
      - '.github/qa/eut-operations-368/**'
      - '.github/workflows/eut-operations-authenticated-qa.yml'
      - 'docs/sql/eut-technician-operations-contract-proposal-20261120.sql'
permissions:
  contents: read
concurrency:
  group: eut-ops-auth-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-operations:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      SUPABASE_ACCESS_TOKEN: ''
      SUPABASE_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: '2.81.3'
      - name: Start disposable Auth + PostgREST + PostgreSQL
        working-directory: .github/qa/eut-operations-368
        run: |
          set -euo pipefail
          supabase start --help >/dev/null
          supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Apply synthetic schema and exact proposal ONLY to local PostgreSQL
        env:
          PGHOST: '127.0.0.1'
          PGPORT: '54322'
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          set -euo pipefail
          command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          psql -X -v ON_ERROR_STOP=1 -f .github/qa/eut-operations-368/fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/sql/eut-technician-operations-contract-proposal-20261120.sql
          psql -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
          sleep 2
      - name: Nine authenticated synthetic cases with real GoTrue sessions
        run: node .github/qa/eut-operations-368/authenticated-check.mjs
