name: EUT #452 mobile popup Chromium 390 focused QA
on:
  push:
    branches:
      - qa/eut-home-452-popup-390-20261122
    paths:
      - src/components/home-community-invite.tsx
      - tests/visual/eut-home-452-popup-390.cjs
      - .github/workflows/eut-home-452-popup-390-qa.yml
permissions:
  contents: read
concurrency:
  group: eut-home-452-popup-390-${{ github.ref }}
  cancel-in-progress: true
jobs:
  visual-mobile-only:
    name: Chromium 390 - search CTA stays accessible
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_452_PARENT: e60aedcc6aed5389690c3d51dd49ebec5722b65d
      SUPABASE_URL: http://127.0.0.1:59999
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QA_local_only
      VITE_EUT_VISITOR_ACCESS_ENABLED: 'false'
      VITE_EUT_ABUSE_ADMIN_ENABLED: 'false'
      EUT_QA_BASE_URL: http://127.0.0.1:4318
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validar fonte e escopo exato sem rodar CI geral
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_452_PARENT"
          git diff --name-only HEAD^ HEAD | LC_ALL=C sort > "$RUNNER_TEMP/qa-actual"
          printf '%s\n' .github/workflows/eut-home-452-popup-390-qa.yml src/components/home-community-invite.tsx tests/visual/eut-home-452-popup-390.cjs | LC_ALL=C sort > "$RUNNER_TEMP/qa-allowed"
          diff -u "$RUNNER_TEMP/qa-allowed" "$RUNNER_TEMP/qa-actual"
          echo "Fonte #452: $EXPECTED_452_PARENT; apenas 1 arquivo funcional e 2 arquivos QA."
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias do app sem repetir Vitest
        run: bun install --frozen-lockfile
      - name: Chromium so no runner efemero
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/eut-home-452-playwright"
          npm --prefix "$RUNNER_TEMP/eut-home-452-playwright" install --no-fund --no-audit --no-save playwright@1.56.1
          "$RUNNER_TEMP/eut-home-452-playwright/node_modules/.bin/playwright" install chromium
      - name: Aplicacao original somente em localhost
        shell: bash
        run: |
          set -euo pipefail
          (bun run dev --host 127.0.0.1 --port 4318 > "$RUNNER_TEMP/eut-home-popup-390-server.log" 2>&1 &)
          ready=0
          for n in $(seq 1 75); do
            if curl -fsS --max-time 2 http://127.0.0.1:4318/ -o /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "Servidor local nao iniciou" >&2
            exit 1
          fi
      - name: Somente QA visual do popup e Busca em 390 px
        env:
          NODE_PATH: ${{ runner.temp }}/eut-home-452-playwright/node_modules
        run: node tests/visual/eut-home-452-popup-390.cjs
      - name: Guardar capturas e JSON mesmo em falha
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eut-home-452-popup-390-${{ github.run_id }}
          path: |
            artifacts/eut-home-452-popup-390/
            ${{ runner.temp }}/eut-home-popup-390-server.log
          retention-days: 7
          if-no-files-found: warn
