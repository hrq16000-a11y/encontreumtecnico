name: EUT Chromium live navigation smoke (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/eut-browser-smoke.yml'
      - 'scripts/eut-browser-smoke.cjs'
      - 'src/routes/tecnicos.index.tsx'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert location touch targets in the reviewed source
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const src = readFileSync('src/routes/tecnicos.index.tsx', 'utf8');
          const ufStart = src.indexOf('id="filtro-uf"');
          assert(ufStart >= 0 && src.slice(ufStart, ufStart + 300).includes('min-h-11'),
            'UF select must have 44px minimum height');
          assert.match(src, /min-h-11[^"]*">Buscar na região/);
          console.log('UF select and regional search touch targets: >= 44px in source');
          NODE
      - name: Install isolated Chromium runner
        run: |
          mkdir -p "$RUNNER_TEMP/eut-browser"
          cd "$RUNNER_TEMP/eut-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: TEMP Stagehand synthetic Chromium QA (remove after evidence)
        env:
          OPENAI_API_KEY: ""
          BROWSERBASE_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: |
          mkdir -p "$RUNNER_TEMP/eut-stagehand"
          cd "$RUNNER_TEMP/eut-stagehand"
          npm init -y >/dev/null
          npm install --ignore-scripts --no-audit --no-fund --save-exact @browserbasehq/stagehand@4.4.0 playwright@1.56.1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createServer } from 'node:http';
          import { once } from 'node:events';
          import { chromium } from 'playwright';
          import { localBrowser, Stagehand } from '@browserbasehq/stagehand';

          const html = '<!doctype html><html lang="pt-BR"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Piloto sintético</title><main><h1>Diretório sintético</h1><label>Busca <input id="busca" aria-label="Busca"></label><button id="cartoes">Cartões</button><output id="estado">Linhas</output></main><script>document.querySelector("#cartoes").onclick=()=>document.querySelector("#estado").textContent="Cartões"</script></html>';
          const server = createServer((_req, res) => {
            res.writeHead(200, { 'content-type': 'text/html; charset=utf-8' });
            res.end(html);
          });
          server.listen(0, '127.0.0.1');
          await once(server, 'listening');
          let browser;
          let stagehand;
          try {
            browser = await localBrowser.launch({
              executablePath: '/usr/bin/google-chrome',
              headless: true,
              chromiumSandbox: false,
            });
            stagehand = await Stagehand.create({ browser });
            const [page] = await browser.context.pages();
            assert.ok(page, 'Stagehand launched without an active page');
            await page.goto('http://127.0.0.1:' + server.address().port);
            assert.equal(await page.locator('h1').innerText(), 'Diretório sintético');
            await page.locator('#busca').fill('Técnico de exemplo');
            assert.equal(await page.locator('#busca').inputValue(), 'Técnico de exemplo');
            await page.locator('#cartoes').click();
            assert.equal(await page.locator('#estado').innerText(), 'Cartões');
            console.log('STAGEHAND_RUNNER_PASS synthetic=1 loopback=1 credentials=0 paid_api=0 production=0');
          } finally {
            if (stagehand) await stagehand.close().catch(() => {});
            if (browser) await browser.close().catch(() => {});
            server.close();
          }
          NODE

      - name: Real public navigation in Chromium and mobile emulation
        env:
          EUT_BASE_URL: https://www.encontreumtecnico.com.br
        run: NODE_PATH="$RUNNER_TEMP/eut-browser/node_modules" node scripts/eut-browser-smoke.cjs
