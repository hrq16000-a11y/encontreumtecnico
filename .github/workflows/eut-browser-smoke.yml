name: EUT Chromium live navigation smoke (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/eut-browser-smoke.yml'
      - 'scripts/eut-browser-smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium runner
        run: |
          mkdir -p "$RUNNER_TEMP/eut-browser"
          cd "$RUNNER_TEMP/eut-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Real public navigation in Chromium and mobile emulation
        env:
          EUT_BASE_URL: https://www.encontreumtecnico.com.br
        run: NODE_PATH="$RUNNER_TEMP/eut-browser/node_modules" node scripts/eut-browser-smoke.cjs
