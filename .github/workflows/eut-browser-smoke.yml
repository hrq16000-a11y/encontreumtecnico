name: EUT Chromium live navigation smoke (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/eut-browser-smoke.yml'
      - 'scripts/eut-browser-smoke.cjs'
      - 'src/routes/tecnicos.index.tsx'
  workflow_dispatch:
    inputs:
      legacy_admin_synthetic_qa:
        description: 'Only run the isolated /admin/legado Chromium fixture'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  public-browser-smoke:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.legacy_admin_synthetic_qa != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert location touch targets in the reviewed source
        run: |
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          const assert = require('node:assert/strict');
          const src = readFileSync('src/routes/tecnicos.index.tsx', 'utf8');
          const ufStart = src.indexOf('id="filtro-uf"');
          assert(ufStart >= 0 && src.slice(ufStart, ufStart + 300).includes('min-h-11'),
            'UF select must have 44px minimum height');
          assert.match(src, /min-h-11[^"]*">Buscar na região/);
          console.log('UF select and regional search touch targets: >= 44px in source');
          NODE
      - name: Install isolated Chromium runner
        run: |
          mkdir -p "$RUNNER_TEMP/eut-browser"
          cd "$RUNNER_TEMP/eut-browser"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Real public navigation in Chromium and mobile emulation
        env:
          EUT_BASE_URL: https://www.encontreumtecnico.com.br
        run: NODE_PATH="$RUNNER_TEMP/eut-browser/node_modules" node scripts/eut-browser-smoke.cjs
  legacy-admin-synthetic-qa:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_admin_synthetic_qa == true && github.ref == 'refs/heads/feat/legacy-admin-card-actions-20261113' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned app dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated Chromium (no repository lockfile change)
        run: |
          mkdir -p "$RUNNER_TEMP/eut-legacy-chromium"
          cd "$RUNNER_TEMP/eut-legacy-chromium"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
      - name: Run isolated Vite fixture and Chromium 390px/1440px
        env:
          EUT_LEGACY_QA_URL: http://127.0.0.1:4187
        run: |
          set -euo pipefail
          ./node_modules/.bin/vite --config scripts/legacy-admin-browser-fixture/vite.config.ts > "$RUNNER_TEMP/eut-legacy-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..40}; do
            if curl --silent --fail --output /dev/null "$EUT_LEGACY_QA_URL"; then break; fi
            sleep 0.5
          done
          curl --silent --show-error --fail "$EUT_LEGACY_QA_URL" > /dev/null || { tail -50 "$RUNNER_TEMP/eut-legacy-vite.log"; exit 1; }
          NODE_PATH="$RUNNER_TEMP/eut-legacy-chromium/node_modules" node scripts/legacy-admin-browser-qa.cjs
