name: EUT admin control center gate
on:
  pull_request:
    paths:
      - 'src/routes/admin.tsx'
      - 'src/components/admin-control-hub.tsx'
      - 'src/components/admin-navigation.tsx'
      - 'src/components/admin-technician-manager.tsx'
      - 'src/components/admin-accounts-manager.tsx'
      - 'src/lib/admin-account-moderation-contract.test.ts'
      - 'docs/sql/eut-admin-accounts-moderation-20261111.sql'
      - 'src/components/legacy-review-queue.tsx'
      - 'src/components/site-header.tsx'
      - 'src/lib/admin-management-contract.test.ts'
      - 'docs/sql/eut-admin-management-actions-20261111.sql'
      - 'docs/sql/eut-admin-legacy-employer-overlay-20261111.sql'
      - 'src/lib/admin-sections.ts'
      - 'src/lib/admin-sections.test.ts'
      - 'src/routes/admin_.$secao.tsx'
      - 'src/components/admin-advertising-manager.tsx'
      - 'docs/admin/PLANO-MESTRE-GESTAO-PATROCINIOS.md'
      - '.github/workflows/eut-admin-control-center.yml'
permissions:
  contents: read
jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Module navigation, RLS and privacy regression tests
        run: bunx vitest run src/lib/admin-sections.test.ts src/lib/admin-management-contract.test.ts src/lib/admin-account-moderation-contract.test.ts
      - name: Verify anonymous cannot read privileged admin data (live, read-only)
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const source = readFileSync('src/integrations/supabase/client.ts', 'utf8');
          const base = source.match(/const SUPABASE_URL = "([^"]+)"/)?.[1];
          const key = source.match(/const SUPABASE_PUBLISHABLE_KEY = "([^"]+)"/)?.[1];
          if (!base || !key || !base.endsWith('.supabase.co')) {
            throw Error('Public Supabase configuration is unavailable');
          }
          // Do not authenticate, create accounts or send a mutating admin action.
          // A protected RPC and a protected audit table must never return HTTP 2xx.
          const probes = [
            { name: 'Private admin accounts directory', path: '/rest/v1/rpc/eut_admin_accounts_snapshot',
              method: 'POST', body: JSON.stringify({ _search: '', _filter: 'todos', _page: 0 }) },
            { name: 'Immutable admin audit table', path: '/rest/v1/eut_admin_management_log?select=id&limit=1', method: 'GET' },
          ];
          for (const probe of probes) {
            const response = await fetch(base + probe.path, {
              method: probe.method,
              headers: { apikey: key, 'content-type': 'application/json' },
              ...(probe.body ? { body: probe.body } : {}),
              signal: AbortSignal.timeout(12000),
            });
            if (![401, 403, 404].includes(response.status)) {
              throw Error(probe.name + ': unexpected anonymous access or API failure (HTTP ' + response.status + ')');
            }
            // Do not log response bodies: they may contain backend details.
            console.log(probe.name + ': anonymous access rejected (HTTP ' + response.status + ')');
          }
          NODE
      - name: Build TanStack
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit --pretty false
      - name: Verify admin navigation and sponsorship roadmap
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const page = readFileSync('src/routes/admin.tsx', 'utf8');
          const hub = readFileSync('src/components/admin-control-hub.tsx', 'utf8');
          const spec = readFileSync('docs/admin/PLANO-MESTRE-GESTAO-PATROCINIOS.md', 'utf8');
          const path = readFileSync('src/routes/admin_.$secao.tsx', 'utf8');
          const menu = readFileSync('src/components/admin-navigation.tsx', 'utf8');
          const sections = readFileSync('src/lib/admin-sections.ts', 'utf8');
          const modules = [
            'tecnicos', 'clientes', 'contas', 'solicitacoes', 'patrocinadores',
            'mensagens', 'catalogo', 'legado', 'reivindicacoes', 'metricas',
          ];
          for (const key of modules) {
            if (!sections.includes('key: "' + key + '"')) throw Error('Module missing: ' + key);
            if (!menu.includes('to="/admin/$secao"') || !menu.includes('params={{ secao: item.key }}'))
              throw Error('Broken admin module navigation');
            if (!page.includes('section === "' + key + '"')) throw Error('Module has no isolated content: ' + key);
          }
          if (!path.includes('validAdminModule(params.secao)') || !path.includes('throw notFound()'))
            throw Error('Admin deep links must reject unknown modules');
          if (!hub.includes('to="/admin/$secao"') || !hub.includes('params={{ secao: item.key }}'))
            throw Error('Admin hub must navigate to real module pages');
          for (const term of [
            'roles.includes("admin")', 'rolesError', 'refreshRoles()', 'noindex, nofollow',
            '<AdminNavigation active={section} />',
            '<AdminControlHub />', '<AdminAdvertisingManager />', '<EutAdminManager />',
            '<LegacyReviewQueue />', '<LegacyClaimReview />',
          ]) if (!page.includes(term)) throw Error('Admin access/feature regression: ' + term);
          for (const term of [
            'Patrocinadores', 'eut_sponsors', 'eut_ad_placements',
            'eut_ad_campaigns', 'eut_admin_audit_log',
            'RLS', 'rollback', 'Publicidade',
          ]) if (!spec.includes(term)) throw Error('Sponsor architecture missing: ' + term);
          if (!hub.includes('Cards patrocinados podem ser aprovados') ||
              !hub.includes('Banners de imagem, segmentação e relatórios') ||
              !hub.includes('ainda dependem das próximas rodadas')) {
            throw Error('Admin hub must distinguish text card delivery from pending image banners');
          }
          console.log('Admin navigation and roadmap contract: OK');
          NODE
