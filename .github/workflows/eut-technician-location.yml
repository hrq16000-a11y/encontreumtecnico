name: Technician location registration gate
on:
  pull_request:
    paths:
      - 'src/routes/area-tecnico.tsx'
      - '.github/workflows/eut-technician-location.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Check UF, municipality, neighborhood, regions
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const s=readFileSync('src/routes/area-tecnico.tsx','utf8');
          for(const v of ['BRAZIL_STATES','validMunicipality(form.state_uf, form.city)','state_uf: form.state_uf','neighborhood: form.neighborhood.trim()','Regiões e outros bairros atendidos','status: "pendente" as const']) {
            if(!s.includes(v))throw Error('Missing location/approval guard: '+v);
          }
          console.log('Technician location fields and review policy preserved');
          NODE
