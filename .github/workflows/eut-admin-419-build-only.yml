name: EUT admin 419 isolated build-only QA

on:
  push:
    branches:
      - qa/eut-admin-419-build-only-20261122
    paths:
      - '.github/workflows/eut-admin-419-build-only.yml'

permissions:
  contents: read

concurrency:
  group: eut-admin-419-build-only-20261122
  cancel-in-progress: false

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa/eut-admin-419-build-only-20261122'
    steps:
      - name: Checkout exact audited release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 5622a15e9c422860aa00fea1d944e20356ad783c
          persist-credentials: false
      - name: Verify exact checkout SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "5622a15e9c422860aa00fea1d944e20356ad783c"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build only
        run: bun run build
