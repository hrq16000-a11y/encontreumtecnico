name: EUT TEMP synthetic R1 R2 SSR cross-check

on:
  push:
    branches: [feature/admin-catalog-canonical-r1-20261112]
    paths: [.github/workflows/eut-temp-r1-r2-ssr-20261113.yml]

permissions:
  contents: read

jobs:
  isolated-ssr:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ""
    steps:
      - name: Checkout R1/R2 proposal only
        uses: actions/checkout@v4
      - name: Checkout isolated public search #255
        uses: actions/checkout@v4
        with:
          ref: 9aa43cc75750d2950cd798e0396536d3e7e3c60a
          path: public255
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: supabase/setup-cli@v3
        with:
          version: "2.84.2"
      - name: Local-only Supabase from six tracked migrations
        shell: bash
        run: |
          set -euo pipefail
          EUT_QA_TMP="$(mktemp -d "$RUNNER_TEMP/eut-ssr-XXXXXX")"
          echo "EUT_QA_TMP=$EUT_QA_TMP" >> "$GITHUB_ENV"
          cd "$EUT_QA_TMP"
          supabase init >/dev/null
          test ! -f supabase/.temp/project-ref
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE"/supabase/migrations/*.sql supabase/migrations/
          test "$(find supabase/migrations -maxdepth 1 -name '*.sql' | wc -l)" -eq 6
          if ! supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor > "$RUNNER_TEMP/eut-ssr-start.log" 2>&1; then
            echo LOCAL_SSR_STACK_BOOTSTRAP_FAILED
            grep -Ei 'error|failed|migration' "$RUNNER_TEMP/eut-ssr-start.log" | tail -n 12 || true
            exit 1
          fi
          umask 077
          supabase status -o env > "$RUNNER_TEMP/eut-ssr-local.env"
      - name: Apply only reviewed synthetic R1 R2 fixture to loopback
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
          set -a
          . "$RUNNER_TEMP/eut-ssr-local.env"
          set +a
          [[ "${DB_URL:-}" == postgresql://*'@127.0.0.1:'* || "${DB_URL:-}" == postgres://*'@127.0.0.1:'* ]] || exit 1
          [[ "${API_URL:-}" == http://127.0.0.1:* || "${API_URL:-}" == http://localhost:* ]] || exit 1
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f docs/sql/tests/eut-canonical-r1-local-only-dependencies-20261113.sql >/dev/null
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f docs/sql/eut-canonical-catalog-r1-proposal-20261112.sql >/dev/null
          node scripts/qa/eut-local-legacy-guards-sql.mjs | psql "$DB_URL" -X -v ON_ERROR_STOP=1 >/dev/null
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -f docs/sql/eut-canonical-catalog-r2-eligibility-proposal-20261113.sql >/dev/null
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';" >/dev/null
          echo LOCAL_SSR_R1_R2_FIXTURE_READY
      - name: Synthetic audited Auth-less records for SSR only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/eut-ssr-local.env"
          set +a
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { writeFileSync } from 'node:fs';
          const { API_URL, ANON_KEY, SERVICE_ROLE_KEY } = process.env;
          assert.match(API_URL, /^http:\/\/(?:localhost|127\.0\.0\.1):\d+$/);
          const request = async (path, key=ANON_KEY, method='GET', body, apiKey=ANON_KEY) => {
            const res=await fetch(API_URL+path,{method,headers:{apikey:apiKey,Authorization:'Bearer '+key,'Content-Type':'application/json'},...(body===undefined?{}:{body:JSON.stringify(body)})});
            const raw=await res.text();const data=raw?JSON.parse(raw):null;
            assert.ok(res.ok, 'Local synthetic '+path+' HTTP '+res.status+' code='+(data?.code??''));
            return data;
          };
          const login='eut-ssr-only-admin@example.invalid';
          const password='Local-SSR-Only-2026-11-13!';
          const owner=await request('/auth/v1/admin/users',SERVICE_ROLE_KEY,'POST',{email:login,password,email_confirm:true},SERVICE_ROLE_KEY);
          const ownerId=owner.user?.id??owner.id;
          await request('/rest/v1/user_roles',SERVICE_ROLE_KEY,'POST',{user_id:ownerId,role:'admin'},SERVICE_ROLE_KEY);
          const admin=(await request('/auth/v1/token?grant_type=password',ANON_KEY,'POST',{email:login,password})).access_token;
          const entries=[
            ['visible','QA SSR Visivel','(41) 98888-7777'],
            ['no_phone','QA SSR Sem Fone',null],
            ['disabled','QA SSR Desabilitado','(41) 98888-7788'],
            ['blocked','QA SSR Bloqueado','(41) 98888-7799'],
            ['no_provenance','QA SSR Sem Origem','(41) 98888-7766'],
          ];
          const ids={};
          for(const [kind,label,phone] of entries){
            const result=await request('/rest/v1/rpc/eut_admin_catalog_upsert',admin,'POST',{
              _origin:'wordpress',_source_key:'wp:ssr:'+kind,_label:label,_city_ibge:null,
              _category_slug:null,_phone_input:phone,_reason:'Homologacao local isolada sem dados reais'
            });
            assert.equal(result.created,true);assert.equal(result.catalog_enabled,true);
            ids[kind]=result.technician_id;
          }
          const listed=await request('/rest/v1/rpc/eut_admin_catalog_list',admin,'POST',{
            _page:0,_limit:20,_search:'',_ids:[ids.disabled]
          });
          const version=listed.rows.find(row=>row.id===ids.disabled)?.updated_at;
          assert.ok(version,'Missing synthetic version');
          const disabled=await request('/rest/v1/rpc/eut_admin_catalog_set_enabled',admin,'POST',{
            _id:ids.disabled,_expected_updated_at:version,_enabled:false,
            _reason:'Desabilitacao apenas no fixture descartavel'
          });
          assert.equal(disabled.catalog_enabled,false);
          writeFileSync(process.env.RUNNER_TEMP+'/eut-ssr-synthetic.json',JSON.stringify(ids),{mode:0o600});
          console.log('LOCAL_SSR_AUTHLESS_UPSERT_OK: 5 synthetic records, one audited disable');
          NODE
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "INSERT INTO eut_moderation.blocked_phones(phone_digits,reason_internal) VALUES('5541988887799','SSR QA fixture');" >/dev/null
          psql "$DB_URL" -X -v ON_ERROR_STOP=1 -c "DELETE FROM eut_moderation.catalog_provenance WHERE source_key='wp:ssr:no_provenance';" >/dev/null
      - name: Install isolated #255 and start TanStack SSR with LOCAL Supabase
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/eut-ssr-local.env"
          set +a
          [[ "${API_URL:-}" == http://127.0.0.1:* || "${API_URL:-}" == http://localhost:* ]] || exit 1
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          const f='public255/src/integrations/supabase/client.ts';
          const source=readFileSync(f,'utf8');
          const old='https://pqtzhctvjbfcunmrvxne.supabase.co';
          assert.equal(source.split(old).length-1,1,'Unexpected #255 client config');
          writeFileSync(f,source.replace(old,process.env.API_URL).replace(/sb_publishable__[A-Za-z0-9_-]+/,process.env.ANON_KEY));
          console.log('LOCAL_SSR_CLIENT_REPOINTED: isolated checkout only');
          NODE
          cd public255
          bun install --frozen-lockfile
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
            bun run dev --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/eut-ssr-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/eut-ssr-vite.pid"
          ready=0
          for attempt in $(seq 1 100); do
            if curl -fsS --max-time 3 http://127.0.0.1:4173/tecnicos >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo LOCAL_SSR_VITE_START_FAILED
            tail -n 45 "$RUNNER_TEMP/eut-ssr-vite.log"
            exit 1
          fi
          echo LOCAL_SSR_TANSTACK_READY
      - name: Check REAL #255 SSR search and profile against R2 local RPC
        shell: bash
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/eut-ssr-local.env"
          set +a
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const ids=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/eut-ssr-synthetic.json','utf8'));
          const {API_URL,ANON_KEY}=process.env;
          const rpc=await fetch(API_URL+'/rest/v1/rpc/eut_public_eligible_technician_ids',{
            method:'POST',headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY,'Content-Type':'application/json'},
            body:JSON.stringify({_ids:Object.values(ids)})
          });
          assert.equal(rpc.status,200,'Local R2 anonymous RPC failed');
          assert.deepEqual((await rpc.json()).map(v=>v.technician_id),[ids.visible],
            'R2 exposed disabled, blocked, missing-provenance or missing-phone record');
          const appOrigin='http://127.0.0.1:4173';
          const redirectStatuses=new Set([301,302,303,307,308]);
          const api=async path=>{
            let target=new URL(path,appOrigin);
            assert.equal(target.origin,appOrigin,'SSR QA initial URL escaped loopback');
            for(let hop=0;hop<=3;hop++){
              const response=await fetch(target,{redirect:'manual'});
              if(!redirectStatuses.has(response.status))return response;
              assert.ok(hop<3,'SSR QA exceeded three canonical redirects');
              const location=response.headers.get('location');
              assert.ok(location,'SSR QA redirect missing Location');
              const next=new URL(location,target);
              assert.equal(next.origin,appOrigin,'SSR QA rejected cross-origin redirect');
              target=next;
            }
            throw new Error('SSR QA redirect guard exhausted');
          };
          // Preserve canonical redirects while refusing off-origin hops.
          const search=await api('/tecnicos/');
          if(search.status!==200){
            const body=await search.text();
            const sanitize=value=>value
              .replace(/sb_[A-Za-z0-9_-]+/g,'[REDACTED_KEY]')
              .replace(/eyJ[A-Za-z0-9._-]{20,}/g,'[REDACTED_JWT]')
              .replace(/(?:\+?55)?\d[\d()\s-]{7,}\d/g,'[REDACTED_NUMBER]')
              .replace(/postgres(?:ql)?:\/\/[^\s"'<>]+/gi,'[REDACTED_DB_URI]');
            console.log('LOCAL_SSR_HTTP_DIAGNOSTIC status='+search.status+' body='+sanitize(body).slice(0,1800));
          }
          assert.equal(search.status,200,'#255 SSR index HTTP status location='+search.headers.get('location'));
          const html=await search.text();
          assert.ok(html.includes('QA SSR Visivel'),'Enabled Auth-less missing from TanStack SSR search');
          for(const text of ['QA SSR Sem Fone','QA SSR Desabilitado','QA SSR Bloqueado','QA SSR Sem Origem',
            '988887777','988887788','988887799','988887766'])
            assert.ok(!html.includes(text),'Private/denied item leaked in SSR search: '+text);
          const record=await fetch(API_URL+'/rest/v1/technicians?select=public_slug&id=eq.'+ids.visible,{
            headers:{apikey:ANON_KEY,Authorization:'Bearer '+ANON_KEY}
          });
          assert.equal(record.status,200);
          const slug=(await record.json())[0]?.public_slug;
          assert.match(slug,/^[a-z0-9]+(?:-[a-z0-9]+)*$/);
          const profile=await api('/tecnicos/'+encodeURIComponent(slug));
          assert.equal(profile.status,200,'#255 SSR profile HTTP status');
          const profileHtml=await profile.text();
          assert.ok(profileHtml.includes('QA SSR Visivel'),'R2 eligible profile did not SSR render');
          assert.ok(!profileHtml.includes('988887777')&&!profileHtml.includes('5541988887777'),
            'Private contact leaked in SSR profile');
          for(const kind of ['no_phone','disabled','blocked','no_provenance']){
            const denied=await api('/tecnicos/'+ids[kind]);
            assert.equal(denied.status,404,'Denied '+kind+' SSR profile was not 404');
          }
          console.log('LOCAL_R1_R2_SSR_255_OK: Auth-less audit -> R2 IDs -> TanStack search and profile; 4 negative cases; private phones hidden');
          NODE
      - name: Read sanitized local Vite stack only on SSR failure
        if: failure()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file=process.env.RUNNER_TEMP+'/eut-ssr-vite.log';
          if(!fs.existsSync(file)){console.log('LOCAL_SSR_VITE_DIAGNOSTIC_UNAVAILABLE');process.exit(0)}
          const lines=fs.readFileSync(file,'utf8').split(/\r?\n/);
          const last=lines.findLastIndex(line=>/Error:|TypeError|ReferenceError|fetch failed|ERR_|500/i.test(line));
          const relevant=last<0?lines.slice(-30):lines.slice(Math.max(0,last-4),last+30);
          const sanitize=value=>value
            .replace(/sb_[A-Za-z0-9_-]+/g,'[REDACTED_KEY]')
            .replace(/eyJ[A-Za-z0-9._-]{20,}/g,'[REDACTED_JWT]')
            .replace(/(?:\+?55)?\d[\d()\s-]{7,}\d/g,'[REDACTED_NUMBER]')
            .replace(/postgres(?:ql)?:\/\/[^\s"'<>]+/gi,'[REDACTED_DB_URI]');
          console.log('LOCAL_SSR_VITE_DIAGNOSTIC '+sanitize(relevant.join('\n')).slice(0,3500));
          NODE
      - name: Stop ephemeral services and remove synthetic secrets
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/eut-ssr-vite.pid" ]; then kill "$(cat "$RUNNER_TEMP/eut-ssr-vite.pid")" 2>/dev/null || true; fi
          if [ -n "${EUT_QA_TMP:-}" ] && [ -d "$EUT_QA_TMP" ]; then
            cd "$EUT_QA_TMP"
            supabase stop --no-backup >/dev/null 2>&1 || true
          fi
          rm -f "$RUNNER_TEMP/eut-ssr-local.env" "$RUNNER_TEMP/eut-ssr-synthetic.json" "$RUNNER_TEMP/eut-ssr-start.log" "$RUNNER_TEMP/eut-ssr-vite.log" "$RUNNER_TEMP/eut-ssr-vite.pid"
