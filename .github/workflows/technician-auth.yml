name: Technician auth gate
on:
  pull_request:
    paths:
      - 'src/routes/entrar.tsx'
      - 'src/hooks/use-auth.tsx'
      - 'src/routes/redefinir-senha.tsx'
      - 'src/routes/reivindicar-cadastro.tsx'
      - 'src/lib/legacy-claim-validation.ts'
      - 'src/lib/legacy-claim-validation.test.ts'
      - 'src/components/legacy-public-archive.tsx'
      - 'src/routes/area-tecnico.tsx'
      - 'src/components/legacy-account-activation.tsx'
      - 'src/components/legacy-profile-import.tsx'
      - '.github/workflows/technician-auth.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Locked dependencies
        run: bun install --frozen-lockfile
      - name: TanStack production build
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit --pretty false
      - name: Legacy claim return validation tests
        run: bunx vitest run src/lib/legacy-claim-validation.test.ts
      - name: Verify auth route and recovery contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const signin = readFileSync('src/routes/entrar.tsx','utf8');
          const auth = readFileSync('src/hooks/use-auth.tsx','utf8');
          for (const v of [
            'await supabase.auth.getUser()',
            'onAuthStateChange',
            'queueMicrotask(',
            'generation',
            'rolesError',
          ]) {
            if (!auth.includes(v)) throw Error('Session ordering / stale query protection missing: '+v);
          }
          if (!signin.includes('Recarregar minha área') || !signin.includes('params.has("error")')) {
            throw Error('OAuth error and failed role recovery UI missing');
          }
          const reset = readFileSync('src/routes/redefinir-senha.tsx','utf8');
          for (const s of ['signInWithPassword','signUp','resetPasswordForEmail','Esqueci minha senha']) {
            if (!signin.includes(s)) throw Error('Missing login flow: '+s);
          }
          for (const s of ['createFileRoute("/redefinir-senha")','updateUser({ password })','noindex, nofollow']) {
            if (!reset.includes(s)) throw Error('Missing recovery flow: '+s);
          }
          for (const s of [
            'eut_my_legacy_account',
            'eut_confirm_my_legacy_account',
            'confirmLegacy',
            'role !== legacyRole',
            'Confirmo meus dados',
            'Verificando seu cadastro anterior',
          ]) {
            if (!signin.includes(s)) throw Error('Missing legacy auto-recovery: '+s);
          }
          const importPanel = readFileSync('src/components/legacy-profile-import.tsx','utf8');
          const activation = readFileSync('src/components/legacy-account-activation.tsx','utf8');
          const techArea = readFileSync('src/routes/area-tecnico.tsx','utf8');
          if (!importPanel.includes('eut_my_linked_legacy_candidate_details') ||
              !importPanel.includes('Reutilizar nome e apresentação') ||
              !activation.includes('eut_confirm_my_legacy_account') ||
              !techArea.includes('LegacyProfileImport')) {
            throw Error('Missing linked WordPress profile confirmation flow');
          }
          const claim = readFileSync('src/routes/reivindicar-cadastro.tsx','utf8');
          for (const s of ['eligibleToClaim','roles.includes("tecnico")','status: "pendente"']) {
            if (!claim.includes(s)) throw Error('Missing manual claim safety: '+s);
          }
          console.log('Technician auth static contract: OK');
          NODE
