name: EUT historical client URL / privacy gate
on:
  pull_request:
    paths:
      - 'src/routes/lista-de-clientes.tsx'
      - '.github/workflows/eut-historical-client-list.yml'
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Sanitize legacy list boundary
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const src=readFileSync('src/routes/lista-de-clientes.tsx','utf8');
          for(const term of ['eut_legacy_url_routes','em_validacao','kind", "employer','noindex, follow','createFileRoute("/lista-de-clientes")']) {
            if(!src.includes(term)) throw Error('Historic public snapshot guard missing: '+term);
          }
          for(const bad of ['service_role','auth.admin','contact_phone','contact_email','wp-content/','wp-json/','wa.me/','.insert(']) {
            if(src.includes(bad))throw Error('Unsafe data or WordPress dependency: '+bad);
          }
          NODE
      - name: WordPress runtime boundary
        run: node scripts/eut-wordpress-runtime-boundary.mjs
      - name: Build (regenerates TanStack route types)
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit --pretty false
