name: EUT paid-contact privacy gate

on:
  pull_request:
    paths:
      - 'src/routes/acesso-contato.$tecnicoId.tsx'
      - 'src/components/assistance-funnel.tsx'
      - 'src/lib/assistance-intent.ts'
      - 'src/components/free-search-help.tsx'
      - 'src/routes/tecnicos.$tecnicoId.tsx'
      - 'src/components/public-technician-profile.tsx'
      - 'src/routes/area-cliente.tsx'
      - 'src/routes/area-tecnico.tsx'
      - 'src/components/technician-private-contact.tsx'
      - 'src/components/request-list.tsx'
      - 'docs/sql/eut-contact-purchase-preparation.sql'
      - 'docs/checkout-contact-activation.md'
      - '.github/workflows/eut-paid-contact-privacy.yml'

permissions:
  contents: read

concurrency:
  group: eut-paid-contacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Build TanStack
        run: bun run build
      - name: TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: No unpaid contact release or technician dispatch
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const read=path=>readFileSync(path,'utf8');
          const routing=read('src/routes/acesso-contato.$tecnicoId.tsx');
          const funnel=read('src/components/assistance-funnel.tsx');
          const support=read('src/components/free-search-help.tsx');
          const profileRoute=read('src/routes/tecnicos.$tecnicoId.tsx');
          const profile=read('src/components/public-technician-profile.tsx');
          if(!profileRoute.includes('PublicTechnicianProfile'))throw Error('Profile route no longer renders the approved public layout');
          const client=read('src/routes/area-cliente.tsx');
          const tech=read('src/routes/area-tecnico.tsx');
          const history=read('src/components/request-list.tsx');
          for(const term of ['AssistanceFunnel', 'mode: "direct"', 'noindex, nofollow',
                             'Nenhum telefone é liberado']) {
            if(!routing.includes(term))throw Error('Historical paid URL must show private assistance funnel: '+term);
          }
          if(profile.includes('to="/acesso-contato/$tecnicoId"') ||
             !profile.includes('openFreeHelp({ mode: "direct"'))
            throw Error('Profile must direct old paid-contact CTAs to the global funnel');
          if(!support.includes('AssistanceFunnel') || !funnel.includes('.from("contact_messages").insert(') ||
             !funnel.includes('Nenhum telefone privado'))
            throw Error('Public paid request must use private lead inbox without contact reveal');
          if(tech.includes('TechnicianRequests')||tech.includes('from("service_requests")')||
             tech.includes('set_request_status')) throw Error('Technician can still browse or accept unpaid requests');
          if(!client.includes('useActiveCategories') || !client.includes('Guard') && !client.includes('categories.some'))
            throw Error('Private triage needs official categories');
          // Private drafts remain private; only an explicitly addressed and consented
          // request can enter the technician's inbox. No paid contact is released.
          if(!client.includes('Necessidade guardada somente na sua área privada')||
             !client.includes('Autorizo compartilhar')||
             !client.includes('eut_share_direct_request')||
             !history.includes('Registrada — privada'))
            throw Error('Draft privacy or explicit sharing consent missing');
          const directInbox=read('src/components/technician-direct-requests.tsx');
          const directSql=read('docs/EUT_PEDIDOS_DIRETOS_SQL_20261109.md');
          if(!directInbox.includes('.select("id,title,description,category,city,region,created_at")'))
            throw Error('Direct-request inbox must select only sanitized non-contact fields');
          for(const term of [
            'create policy "Technician reads only explicitly shared direct requests"',
            'eut_direct_request_consents', 'authenticated',
            'verified client account required', 'daily direct-request limit reached',
            'revoke all on public.eut_direct_request_consents'
          ]) {
            if(!directSql.includes(term)) throw Error('Missing consent and RLS protection: '+term);
          }
          if([routing, funnel, support].some(src =>
               src.includes('.select("phone")') || src.includes('service_role') ||
               src.includes('eut_reveal_paid_technician_contact') ||
               src.includes('eut_prepare_contact_purchase') ||
               src.includes('signInWithOAuth')))
            throw Error('Public funnel must not expose, purchase, validate or unlock private contacts');
          const stagedSql=read('docs/sql/eut-contact-purchase-preparation.sql');
          const activation=read('docs/checkout-contact-activation.md');
          for(const term of [
            'eut_contact_purchase_intents', 'eut_prepare_contact_purchase',
            "interval '15 minutes'", 'pg_advisory_xact_lock',
            'v_entitlements+v_active_orders>=2', "'confirmed client session required'",
            "'payment_available',false", "'contact_released',false"
          ]) if(!stagedSql.includes(term))throw Error('Payment staging guard absent: '+term);
          if(!activation.includes('NÃO cobra') || !activation.includes('webhook') ||
            !activation.includes('sem transação')) {
            throw Error('Activation checklist could misrepresent a paid transaction');
          }
          const privateUi=read('src/components/technician-private-contact.tsx');
          for(const term of [
            'eut_my_private_contact',
            'eut_save_my_private_contact',
            'eut_remove_my_private_contact',
            'Autorizo que meu número seja fornecido'
          ]) {
            if(!privateUi.includes(term))throw Error('Missing private phone operation: '+term);
          }
          if(!tech.includes('<TechnicianPrivateContact userId={user.id} />')) {
            throw Error('Technician does not have private contact preferences');
          }
          if(!funnel.includes('Ainda não houve cobrança') &&
             !funnel.includes('Ninguém paga nesta etapa') &&
             !funnel.includes('Nada será cobrado nesta etapa'))
            throw Error('Funnel must disclose no charge or paid-contact rights');
          for(const forbidden of ['Verificar contato já adquirido','Consultando compra',
                                  'Criar checkout','Pagar agora','phone_e164','wa.me/']) {
            if([routing, funnel, support, profile].some(src=>src.includes(forbidden)))
              throw Error('Suspended payment / private phone interface still publicly reachable: '+forbidden);
          }
          const publicSearch=read('src/lib/technicians.functions.ts');
          if(publicSearch.includes('phone_e164') || publicSearch.includes('eut_technician_private_contacts')) {
            throw Error('Private contacts must not appear in SSR technician search');
          }
          if(privateUi.includes('.from("eut_technician_private_contacts")') ||
             routing.includes('.from("eut_technician_private_contacts")') ||
             funnel.includes('.from("eut_technician_private_contacts")')) {
            throw Error('Client must not query private table directly');
          }
          console.log('Private customer triage, closed technician inbox and no unpaid contact claims: OK');
          NODE
      - name: Public RPC must not allow anonymous quote
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const file=readFileSync('src/integrations/supabase/client.ts','utf8');
          const url=file.match(/const SUPABASE_URL = "([^"]+)"/)?.[1];
          const key=file.match(/const SUPABASE_PUBLISHABLE_KEY = "([^"]+)"/)?.[1];
          if(!url||!key)throw Error('Missing Supabase publishable client settings');
          const response=await fetch(url+'/rest/v1/rpc/eut_contact_access_quote',{
            method:'POST',
            headers:{apikey:key,'Content-Type':'application/json'},
            body:JSON.stringify({_technician_id:'00000000-0000-4000-8000-000000000000'}),
            signal:AbortSignal.timeout(12000)
          });
          if(response.ok)throw Error('Anonymous quote RPC unexpectedly permitted');
          console.log('Anonymous quote denied: HTTP '+response.status);
          for (const [fn,payload] of [
            ['eut_my_private_contact',{}],
            ['eut_save_my_private_contact',{_phone:'+5541999999999',_allow_paid_contact:true}],
            ['eut_remove_my_private_contact',{}],
            ['eut_reveal_paid_technician_contact',{_technician_id:'00000000-0000-4000-8000-000000000000'}],
            ['eut_prepare_contact_purchase',{_technician_id:'00000000-0000-4000-8000-000000000000'}]
          ]) {
            const denied=await fetch(url+'/rest/v1/rpc/'+fn,{
              method:'POST', headers:{apikey:key,'Content-Type':'application/json'},
              body:JSON.stringify(payload),signal:AbortSignal.timeout(12000)
            });
            if(denied.ok)throw Error('Anonymous API gained unauthorized access to '+fn);
            console.log(fn+': anonymous denied HTTP '+denied.status);
          }
          NODE
