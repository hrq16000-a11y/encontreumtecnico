name: EUT technician durable draft RLS ephemeral gate

on:
  pull_request:
    paths:
      - 'docs/sql/eut-technician-drafts-rls-staging-proposal-20261112.sql'
      - 'docs/sql/eut-technician-draft-retention-staging-proposal-20261112.sql'
      - 'docs/sql/tests/eut-technician-draft-ephemeral-*.sql'
      - 'docs/admin/TECNICO_RASCUNHOS_DURAVEIS_2026-11-12.md'
      - '.github/workflows/eut-technician-draft-rls-staging.yml'
      - 'src/lib/staged-technician-durable-draft.ts'
      - 'src/lib/staged-technician-durable-draft.test.ts'
      - 'src/lib/technician-draft-recovery-decision.ts'
      - 'src/lib/technician-draft-recovery-decision.test.ts'
      - '.github/workflows/eut-draft-maintenance-manual.yml'

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eut_draft_fixture
          POSTGRES_PASSWORD: ephemeral_only_not_a_secret
          POSTGRES_DB: eut_draft_fixture
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eut_draft_fixture -d eut_draft_fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: eut_draft_fixture
      PGPASSWORD: ephemeral_only_not_a_secret
      PGDATABASE: eut_draft_fixture
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL CLI
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)
      - name: Set up disposable roles and fictional accounts
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/tests/eut-technician-draft-ephemeral-schema-20261112.sql
      - name: Install DRAFT SQL in disposable PostgreSQL only
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/eut-technician-drafts-rls-staging-proposal-20261112.sql
      - name: Install private cleanup function in disposable PostgreSQL only
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/eut-technician-draft-retention-staging-proposal-20261112.sql
      - name: Verify owner RLS, rejection, revision, retention and revocation
        run: psql -X -v ON_ERROR_STOP=1 -f docs/sql/tests/eut-technician-draft-ephemeral-assertions-20261112.sql
      - name: Ensure no production migration was created
        run: |
          test ! -f supabase/migrations/eut-technician-drafts-rls-staging-proposal-20261112.sql
          test -f docs/sql/eut-technician-drafts-rls-staging-proposal-20261112.sql
          test -f docs/sql/eut-technician-draft-retention-staging-proposal-20261112.sql
          test ! -f supabase/migrations/eut-technician-draft-retention-staging-proposal-20261112.sql

  adapter-not-activated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Locked dependencies
        run: bun install --frozen-lockfile
      - name: Check staged PostgREST adapter with synthetic clients
        run: bunx vitest run src/lib/staged-technician-durable-draft.test.ts src/lib/technician-draft-recovery-decision.test.ts
      - name: Build TanStack and generate route types
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit --pretty false
      - name: Verify maintenance workflow is manual only and not installed in production
        run: |
          test -f .github/workflows/eut-draft-maintenance-manual.yml
          ! grep -Eq '^  schedule:|^  push:|^  pull_request:' .github/workflows/eut-draft-maintenance-manual.yml
          ! grep -Eq 'SUPABASE_SERVICE_ROLE_KEY|secrets\\.SUPABASE_' .github/workflows/eut-draft-maintenance-manual.yml
