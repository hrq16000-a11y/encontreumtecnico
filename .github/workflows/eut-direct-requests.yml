name: EUT opt-in direct requests

on:
  pull_request:
    paths:
      - 'src/components/technician-direct-requests.tsx'
      - 'src/lib/account-scoped-queries.ts'
      - 'src/lib/account-scoped-queries.test.ts'
      - 'src/lib/client-request-action.ts'
      - 'src/lib/client-request-action.test.ts'
      - 'src/lib/client-request-wizard.ts'
      - 'src/lib/client-request-wizard.test.ts'
      - 'docs/sql/eut-direct-flow-readiness-readonly.sql'
      - 'src/routes/area-tecnico.tsx'
      - 'src/routes/area-cliente.tsx'
      - 'src/routes/tecnicos.$tecnicoId.tsx'
      - 'src/components/public-technician-profile.tsx'
      - 'docs/EUT_PEDIDOS_DIRETOS_SQL_20261109.md'
      - '.github/workflows/eut-direct-requests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eut-direct-requests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Test isolation between accounts and stale queries
        run: bun run test src/lib/account-scoped-queries.test.ts src/lib/client-request-action.test.ts src/lib/client-request-wizard.test.ts
      - name: Verify opt-in contract and no private contacts
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read=(s)=>readFileSync(s,'utf8');
          const client=read('src/routes/area-cliente.tsx');
          const technician=read('src/components/technician-direct-requests.tsx');
          const profileRoute=read('src/routes/tecnicos.$tecnicoId.tsx');
          const profile=read('src/components/public-technician-profile.tsx');
          if(!profileRoute.includes('PublicTechnicianProfile'))throw Error('Profile route no longer renders the approved public layout');
          const sql=read('docs/EUT_PEDIDOS_DIRETOS_SQL_20261109.md');
          for(const fragment of ['shareNow','eut_share_direct_request','Autorizo compartilhar','eut_direct_request_consents']) {
            if(!client.includes(fragment)) throw Error('Missing client consent: '+fragment);
          }
          if(!technician.includes('.select("id,title,description,category,city,region,created_at")')) throw Error('Technician list can expose extra fields');
          if(technician.includes('contact_phone') || technician.includes('contact_email')) throw Error('Contact data in technician inbox');
          for (const file of [client, technician]) {
            if (!file.includes('accountScopedRows') || !file.includes('canAcceptAccountResult')) {
              throw Error('Missing same-tab account isolation or stale-query protection');
            }
          }
          if (!client.includes('setRowsError(true)') || !client.includes('role="alert"')) {
            throw Error('Failed private query must show an error instead of a false empty state');
          }
          if(!profile.includes('to="/area-cliente" search={{ tecnico: t.id }}')) throw Error('Profile CTA missing');
          for(const fragment of ['create policy "Technician reads only explicitly shared direct requests"','daily direct-request limit reached','revoke all on public.eut_direct_request_consents']) {
            if(!sql.includes(fragment)) throw Error('Missing DB restriction: '+fragment);
          }
          const guard=read('src/lib/client-request-action.ts');
          const audit=read('docs/sql/eut-direct-flow-readiness-readonly.sql');
          for(const phrase of ['ownedRequestForAction(ownRows, owner, id, "share")',
                                'ownedRequestForAction(ownRows, owner, id, "cancel")',
                                'currentUserIdRef.current !== owner']) {
            if(!client.includes(phrase)) throw Error('Account switching guard missing: '+phrase);
          }
          if (!guard.includes('row.client_id === ownerId') ||
              !guard.includes('row.status === "cancelada"') && !guard.includes('row.status === "aberta"')) {
            throw Error('Ownership/state validation regressed');
          }
          for(const flag of ['rls_tecnico_exige_consentimento',
                             'rls_pedido_somente_pelo_cliente',
                             'anon_impedido_de_compartilhar',
                             'oauth_duas_contas_homologado']) {
            if(!audit.includes(flag)) throw Error('Read-only audit lost: '+flag);
          }
          if(/\b(?:INSERT\s+INTO|UPDATE\s+public|DELETE\s+FROM|CREATE\s+TABLE|ALTER\s+TABLE|DROP\s+TABLE)\b/i.test(audit)) {
            throw Error('Operational audit must never write data');
          }
          console.log('Opt-in direct requests and account switching safety: PASS');
          NODE
      - name: Build TanStack and route types
        run: bun run build
      - name: TypeScript after build
        run: bunx tsc --noEmit --pretty false
