name: EUT specific services and location filters

on:
  pull_request:
    paths:
      - 'src/routes/area-tecnico.tsx'
      - 'src/routes/tecnicos.index.tsx'
      - 'src/routes/tecnicos.$tecnicoId.tsx'
      - 'src/lib/technicians.functions.ts'
      - 'src/hooks/use-active-services.ts'
      - 'src/integrations/supabase/types.ts'
      - '.github/workflows/eut-specific-services.yml'

permissions:
  contents: read

concurrency:
  group: eut-services-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build TanStack Start
        run: bun run build
      - name: TypeScript check
        run: bunx tsc --noEmit --pretty false
      - name: Check services and location contract
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const read=p=>readFileSync(p,'utf8');
          const tech=read('src/routes/area-tecnico.tsx');
          const filter=read('src/routes/tecnicos.index.tsx');
          const server=read('src/lib/technicians.functions.ts');
          const catalog=read('src/hooks/use-active-services.ts');
          const profile=read('src/routes/tecnicos.$tecnicoId.tsx');
          for (const item of ['form.service_slugs.length === 0','service_slugs: form.service_slugs','status: "pendente" as const']) {
            if (!tech.includes(item)) throw Error('Technician form contract absent: '+item);
          }
          for (const item of ['servico: fallback','uf: fallback','bairro: fallback','filtro-servico','filtro-uf','filtro-bairro']) {
            if (!filter.includes(item)) throw Error('Search field absent: '+item);
          }
          for (const item of ['service_slugs','eq("status", "aprovado")','eq("state_uf", uf)','ilike("neighborhood"','eq("active", true)']) {
            if (!server.includes(item)) throw Error('Public search protection absent: '+item);
          }
          if (!catalog.includes('eut_service_types') || !catalog.includes('.eq("active", true)')) throw Error('Official service catalog missing');
          if (!profile.includes('t.service_slugs')) throw Error('Public profile service list missing');
          console.log('Service and location filters: guarded contracts OK');
          NODE
      - name: Check catalog GET without login
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const src=readFileSync('src/integrations/supabase/client.ts','utf8');
          const url=src.match(/const SUPABASE_URL = "([^"]+)"/)?.[1];
          const key=src.match(/const SUPABASE_PUBLISHABLE_KEY = "([^"]+)"/)?.[1];
          if (!url || !key) throw Error('No public Supabase config');
          const response=await fetch(url+'/rest/v1/eut_service_types?select=slug,category_slug,label&active=eq.true',{headers:{apikey:key},signal:AbortSignal.timeout(12000)});
          if (!response.ok) throw Error('Public service catalog HTTP '+response.status);
          const items=await response.json();
          if (!Array.isArray(items) || items.length<25) throw Error('Public service types fewer than source inventory');
          console.log('Active service catalog GET OK:',items.length);
          NODE
